<!-- Sidebar Component -->

<div :style="`width: ${sidebarWidth}px`"
     class="bg-white border-r border-gray-200 flex flex-col overflow-hidden relative"
     x-data="sidebar"
     x-init="init()">

    <!-- Resize Handle - More visible -->
    <div @mousedown="startResize($event)"
        class="absolute right-0 top-0 w-2 h-full cursor-col-resize hover:bg-gray-400 hover:w-1.5 z-50 transition-all opacity-0 hover:opacity-60"
        :class="{ 'bg-gray-400 w-1.5': isResizing }"
        title="Drag to resize sidebar">
        <div class="w-0.5 h-full bg-gray-300 mx-auto mt-2 rounded"></div>
    </div>

    <!-- Sidebar Header -->
    <div class="p-2 border-b border-gray-200 flex items-center justify-between gap-1 flex-shrink-0">
        <template x-if="sidebarWidth > 180">
            <button
                @click="createNewConversation()"
                class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2 whitespace-nowrap">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span x-show="sidebarWidth > 220">New Chat</span>
            </button>
        </template>
        <button
            @click="toggleSidebar()"
            class="p-2 rounded-lg hover:bg-gray-100 transition text-gray-600 flex-shrink-0"
            :title="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
            <svg class="w-5 h-5 transition-transform duration-300" :class="sidebarCollapsed ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
            </svg>
        </button>
    </div>

    <!-- Conversations List (Expanded) -->
    <div class="flex-1 overflow-y-auto p-1 space-y-1" style="scrollbar-width: thin;" x-show="!sidebarCollapsed">
        <template x-for="conv in conversations" :key="conv.id">
            <div
                @click="loadConversation(conv.id)"
                :class="currentConversationId === conv.id ? 'bg-blue-100' : 'bg-white hover:bg-gray-50'"
                class="rounded-lg cursor-pointer transition group">
                <div class="flex justify-between items-center px-2 py-2">
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-sm text-gray-900 truncate" x-text="conv.title"></div>
                        <div class="text-xs text-gray-500 mt-0.5" x-text="formatDate(conv.updated_at)"></div>
                    </div>
                    <button
                        @click="deleteConversation(conv.id, $event)"
                        class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition p-1 flex-shrink-0 ml-2"
                        title="Delete conversation">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- Quick Access Icons (Collapsed) -->
    <div class="flex-1 overflow-y-auto p-2 space-y-2" x-show="sidebarCollapsed">
        <template x-for="conv in conversations.slice(0, 5)" :key="conv.id">
            <div
                @click="loadConversation(conv.id); sidebarCollapsed = false"
                :class="currentConversationId === conv.id ? 'bg-blue-100' : 'hover:bg-gray-100'"
                class="p-2 rounded-lg cursor-pointer transition flex items-center justify-center"
                :title="conv.title">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
            </div>
        </template>
    </div>

    <!-- Bottom Actions (Expanded) -->
    <div class="border-t border-gray-200 flex-shrink-0" x-show="!sidebarCollapsed">
        <a href="/knowledge"
            class="w-full text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <span x-show="sidebarWidth > 220">Knowledge Base</span>
        </a>
        <a href="/settings"
            class="w-full text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span x-show="sidebarWidth > 220">Settings</span>
        </a>
        <a href="/agents"
            class="w-full text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span x-show="sidebarWidth > 220">AI Agents</span>
        </a>
        <button @click="toggleMcpPanel()"
            class="w-full text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <span x-show="sidebarWidth > 220">MCP Servers</span>
        </button>
    </div>

    <!-- Bottom Actions (Collapsed) -->
    <div class="border-t border-gray-200 flex-shrink-0" x-show="sidebarCollapsed">
        <a href="/knowledge"
            class="w-full p-2 text-gray-600 hover:bg-gray-100 transition flex items-center justify-center"
            title="Knowledge Base">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
        </a>
        <a href="/settings"
            class="w-full p-2 text-gray-600 hover:bg-gray-100 transition flex items-center justify-center"
            title="Settings">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </a>
        <a href="/agents"
            class="w-full p-2 text-gray-600 hover:bg-gray-100 transition flex items-center justify-center"
            title="AI Agents">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
        </a>
        <button @click="toggleMcpPanel()"
            class="w-full p-2 text-gray-600 hover:bg-gray-100 transition flex items-center justify-center"
            title="MCP Servers">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </button>
    </div>
</div>
