<!-- ═══════════ READER OVERLAY (fullscreen, fixed) ═══════════ -->
<!--
  Fullscreen reader. PDF is rendered by PDF.js' own multi-page viewer
  (PDFViewer from pdfjs-dist/web/pdf_viewer.js) which gives us scroll,
  page navigation, keyboard arrows, link annotations, lazy page
  rendering, and a text layer for free — the same machinery Mozilla's
  reference viewer.html uses. We hook into the `textlayerrendered`
  event to capture the per-page textDivs, then toggle .pdf-highlight
  on the spans that overlap the current TTS sentence.

  EPUB has no native viewer here; the right pane is a sentence list
  the user can click to jump.
-->
<div
  x-data="reader"
  x-show="open"
  x-cloak
  @keydown.escape.window="if (open) handleEscape()"
  @keydown.window="if (open && (($event.ctrlKey || $event.metaKey) && $event.key && $event.key.toLowerCase() === 'f' && book && book.file_type === 'pdf')) { $event.preventDefault(); openFind() }"
  class="fixed inset-0 z-[200] bg-[var(--bg-primary)] flex flex-col"
>
  <!-- Header / transport bar -->
  <div
    class="flex items-center gap-3 px-4 py-1 border-b border-[var(--border-primary)]
           bg-[var(--bg-secondary)] flex-shrink-0"
  >
    <button @click="close()" class="btn btn-icon btn-xs btn-ghost" title="Back (Esc)">
      <i class="ph ph-arrow-left text-lg"></i>
    </button>
    <div class="flex-1 min-w-0">
      <h2 class="font-semibold text-sm truncate" x-text="book?.title || 'Reader'"></h2>
      <!--<p class="text-xs text-[var(--text-tertiary)]" x-show="sentences.length">
        <span x-text="`Sentence ${currentIdx + 1} of ${sentences.length}`"></span>
        <span x-show="book?.file_type === 'pdf' && pdfReady">
          · <span x-text="`Page ${currentPdfPage} of ${pdfNumPages || '?'}`"></span>
        </span>
      </p> -->
    </div>

    <!-- PDF nav controls -->
    <div
      class="flex items-center gap-1"
      x-show="book?.file_type === 'pdf' && pdfReady"
    >
      <button
        @click="goToPage(1)"
        :disabled="currentPdfPage <= 1"
        class="btn btn-icon btn-xs btn-ghost"
        title="First page"
      >
        <i class="ph ph-skip-back text-lg"></i>
      </button>
      <button
        @click="goToPage(currentPdfPage - 1)"
        :disabled="currentPdfPage <= 1"
        class="btn btn-icon btn-xs btn-ghost"
        title="Previous page"
      >
        <i class="ph ph-caret-left text-lg"></i>
      </button>
      <div class="flex items-center gap-1 text-sm px-2">
        <input
          type="number"
          min="1"
          :max="pdfNumPages"
          :value="currentPdfPage"
          @change="goToPage(parseInt($event.target.value, 10) || 1)"
          class="w-14 text-center px-1 py-0.5 rounded border border-[var(--border-primary)] bg-[var(--bg-primary)]"
        />
        <span class="text-[var(--text-tertiary)]" x-text="`/ ${pdfNumPages || '?'}`"></span>
      </div>
      <button
        @click="goToPage(currentPdfPage + 1)"
        :disabled="currentPdfPage >= pdfNumPages"
        class="btn btn-icon btn-xs btn-ghost"
        title="Next page"
      >
        <i class="ph ph-caret-right text-lg"></i>
      </button>
      <button
        @click="goToPage(pdfNumPages)"
        :disabled="currentPdfPage >= pdfNumPages"
        class="btn btn-icon btn-xs btn-ghost hidden sm:inline-flex"
        title="Last page"
      >
        <i class="ph ph-skip-forward text-lg"></i>
      </button>

      <!-- PDF zoom: out / % readout (click to reset to 100%) / in / fit-width.
           Hidden on mobile (below `sm`) — the user's thumbs can't reach
           precision zoom buttons accurately and they steal room from the
           always-on prev/next/page controls. -->
      <div class="hidden sm:flex items-center gap-0.5 ml-1 pl-2 border-l border-[var(--border-primary)]">
        <button
          @click="zoomOut()"
          :disabled="zoomPct <= 25"
          class="btn btn-icon btn-xs btn-ghost"
          title="Zoom out"
        >
          <i class="ph ph-magnifying-glass-minus text-lg"></i>
        </button>
        <button
          @click="zoomReset()"
          class="text-xs tabular-nums min-w-11 text-center px-1 py-0.5 rounded hover:bg-[var(--bg-tertiary)] text-[var(--text-secondary)]"
          title="Reset to 100%"
          x-text="zoomPct + '%'"
        ></button>
        <button
          @click="zoomIn()"
          :disabled="zoomPct >= 500"
          class="btn btn-icon btn-xs btn-ghost"
          title="Zoom in"
        >
          <i class="ph ph-magnifying-glass-plus text-lg"></i>
        </button>
        <button
          @click="zoomFit()"
          class="btn btn-icon btn-xs btn-ghost"
          title="Fit to width"
        >
          <i class="ph ph-scan text-lg"></i>
        </button>
      </div>

      <!-- Start TTS from the top of the currently displayed page. Hidden
           on small screens — the play button in the top-right does the
           obvious thing; "from page" is power-user on desktop. -->
      <button
        @click="playFromPage()"
        class="btn btn-xs btn-ghost ml-1 hidden md:inline-flex"
        title="Start reading from the top of this page"
      >
        <i class="ph ph-play-circle text-lg"></i>
        <span class="text-xs hidden xl:inline">From page</span>
      </button>
    </div>

    <!-- Go back to the sentence currently being spoken (shown only while
         TTS plays and the user scrolled/jumped away from it) -->
    <button
      x-show="isPlaying && pageMap[currentIdx] && pageMap[currentIdx] !== currentPdfPage"
      @click="_goToSpokenPage()"
      class="btn btn-icon btn-xs btn-ghost"
      title="Go to current spoken page"
    >
      <i class="ph ph-crosshair text-lg"></i>
    </button>

    <!-- Find in document (PDF only) -->
    <button
      x-show="book?.file_type === 'pdf' && pdfReady"
      @click="findOpen ? closeFind() : openFind()"
      class="btn btn-icon btn-xs btn-ghost"
      :class="findOpen ? 'bg-[var(--bg-tertiary)]' : ''"
      title="Find in document (Ctrl+F)"
    >
      <i class="ph ph-magnifying-glass text-lg"></i>
    </button>

    <!-- Outline toggle (PDF only) -->
    <button
      x-show="book?.file_type === 'pdf' && pdfReady"
      @click="outlineOpen = !outlineOpen"
      class="btn btn-icon btn-xs btn-ghost"
      :class="outlineOpen ? 'bg-[var(--bg-tertiary)]' : ''"
      title="Outline / bookmarks"
    >
      <i class="ph ph-list-numbers text-lg"></i>
    </button>

    <!-- Playback volume / boost (0.5×–2×). Web Audio gain on the player,
         so it can go past the <audio> element's 100% ceiling. Persisted via
         localStorage + Settings → TTS. -->
    <div
      class="hidden sm:flex items-center gap-1.5 pl-1"
      x-show="sentences.length"
      title="Playback volume (boost)"
    >
      <i class="ph ph-speaker-high text-base text-[var(--text-tertiary)]"></i>
      <input
        type="range"
        min="0.5"
        max="2"
        step="0.05"
        :value="volume"
        @input="volume = parseFloat($event.target.value); onVolumeInput()"
        class="w-20 lg:w-24 accent-[var(--accent-primary)]"
      />
      <span
        class="text-xs tabular-nums w-9 text-[var(--text-tertiary)]"
        x-text="Math.round(volume * 100) + '%'"
      ></span>
    </div>

    <!-- Sentence skip controls. Walk one sentence back/forward and
         restart TTS from that point — pressing repeatedly moves the
         cursor step by step. Disabled at the start/end of the book. -->
    <div
      class="flex items-center"
      x-show="sentences.length"
    >
      <button
        @click="prevSentence()"
        :disabled="!currentIdx"
        class="btn btn-icon btn-xs btn-ghost"
        title="Previous sentence (←)"
      >
        <i class="ph ph-rewind text-lg"></i>
      </button>
      <button
        @click="nextSentence()"
        :disabled="currentIdx >= sentences.length - 1"
        class="btn btn-icon btn-xs btn-ghost"
        title="Next sentence (→)"
      >
        <i class="ph ph-fast-forward text-lg"></i>
      </button>
    </div>

    <button
      x-show="sentences.length"
      @click="toggle()"
      class="btn btn-primary btn-xs px-4"
      :title="isPlaying ? 'Pause (Space)' : 'Play (Space)'"
    >
      <i class="ph text-lg" :class="isPlaying ? 'ph-pause' : 'ph-play'"></i>
      <span class="ml-1.5 text-xs" x-text="isPlaying ? 'Pause' : 'Play'"></span>
    </button>

    <!-- Article / Read-aloud toggle (web + paste saves with a snapshot) -->
    <div
      x-show="hasArticle()"
      class="flex items-center rounded-lg overflow-hidden border border-[var(--border-primary)] text-xs"
    >
      <button
        @click="readerView = 'article'"
        class="px-2.5 py-1.5 font-medium transition-colors"
        :class="readerView === 'article' ? 'bg-[var(--accent-primary)] text-white' : 'text-[var(--text-tertiary)] hover:text-[var(--text-primary)]'"
        title="Formatted article with pictures"
      >
        <i class="ph ph-article text-sm"></i>
        <span class="ml-1 hidden sm:inline">Article</span>
      </button>
      <button
        @click="readerView = 'tts'"
        class="px-2.5 py-1.5 font-medium transition-colors"
        :class="readerView === 'tts' ? 'bg-[var(--accent-primary)] text-white' : 'text-[var(--text-tertiary)] hover:text-[var(--text-primary)]'"
        title="Sentence list for read-aloud"
      >
        <i class="ph ph-speaker-high text-sm"></i>
        <span class="ml-1 hidden sm:inline">Read aloud</span>
      </button>
    </div>
  </div>

  <!-- Progress bar -->
  <!--
  <div
    class="h-1 bg-[var(--bg-tertiary)] flex-shrink-0"
    x-show="sentences.length"
  >
    <div
      class="h-full bg-[var(--accent-primary)] transition-all"
      :style="`width: ${progressPct()}%`"
    ></div>
  </div>
-->
  <!-- Error banner -->
  <div
    x-show="error"
    class="px-4 py-2 bg-[var(--error-bg)] text-[var(--error)] text-sm flex items-center gap-2 flex-shrink-0"
  >
    <i class="ph ph-warning"></i>
    <span x-text="error"></span>
    <button @click="error = ''" class="ml-auto"><i class="ph ph-x"></i></button>
  </div>

  <!-- Main content row: viewer/EPUB pane first, outline sidebar on the
       right (matches the toggle button's position in the header). -->
  <div class="flex-1 min-h-0 flex">
    <!-- PDF.js viewer or EPUB sentence list. The PDF host is the stable
         mount point: reader.js builds a fresh .pdfjs-container subtree
         inside it per open (PDFViewer leaks a ResizeObserver on its
         container otherwise) and drops it on close. The container does
         its own scrolling (position:absolute + overflow:auto). -->
    <div class="flex-1 min-w-0 relative bg-[var(--bg-tertiary)]">
      <div
        x-ref="pdfHost"
        class="pdfjs-host"
        x-show="book?.file_type === 'pdf'"
      ></div>

      <!-- PDF find bar (search). Anchored to the right edge of the
           viewer so it doesn't sit on top of the searched text — the
           viewer scrolls underneath while the bar stays put. -->
      <div
        x-show="findOpen && book?.file_type === 'pdf' && pdfReady"
        x-cloak
        class="absolute top-3 right-3 z-20 flex items-center gap-1.5 px-3 py-2 rounded-xl
               border border-[var(--border-primary)] bg-[var(--bg-secondary)] shadow-xl
               w-[calc(100%-1.5rem)] sm:w-auto"
      >
        <i class="ph ph-magnifying-glass text-[var(--text-tertiary)]"></i>
        <input
          x-ref="findInput"
          type="text"
          x-model="findQuery"
          placeholder="Find in document…"
          @input="findOnInput()"
          @keydown.enter.prevent="findNext()"
          @keydown.shift.enter.prevent="findPrev()"
          @keydown.escape.stop="closeFind()"
          class="input text-sm w-40 sm:w-56"
        />
        <span
          x-show="!findPending && !findNotFound && findTotal > 0 && findQuery"
          class="text-xs tabular-nums text-[var(--text-tertiary)] min-w-12 text-center"
          x-text="`${findCurrent} / ${findTotal}`"
        ></span>
        <span
          x-show="findPending && findQuery"
          class="text-xs text-[var(--text-tertiary)] flex items-center gap-1"
        >
          <i class="ph ph-spinner-gap animate-spin"></i> Searching…
        </span>
        <span
          x-show="!findPending && findNotFound && findQuery"
          class="text-xs text-amber-500"
        >
          No matches
        </span>
        <div class="flex items-center ml-1">
          <button
            @click="findPrev()"
            class="btn btn-icon btn-ghost p-1.5"
            title="Previous match (Shift+Enter)"
          >
            <i class="ph ph-caret-up text-sm"></i>
          </button>
          <button
            @click="findNext()"
            class="btn btn-icon btn-ghost p-1.5"
            title="Next match (Enter)"
          >
            <i class="ph ph-caret-down text-sm"></i>
          </button>
          <button
            @click="closeFind()"
            class="btn btn-icon btn-ghost p-1.5"
            title="Close (Esc)"
          >
            <i class="ph ph-x text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Loading spinner while the PDF.js viewer initializes -->
      <div
        x-show="book?.file_type === 'pdf' && isLoading"
        class="absolute inset-0 flex items-center justify-center text-[var(--text-tertiary)] pointer-events-none"
      >
        <i class="ph ph-spinner-gap animate-spin text-2xl"></i>
        <span class="ml-2 text-sm">Loading book…</span>
      </div>
      <div
        x-show="book?.file_type !== 'pdf'"
        class="flex-1 min-h-0  w-3/4 h-full flex flex-col"
      >
        <!-- Link card: site blocked scraping — attribution + open original -->
        <div
          x-show="!isLoading && isLinkCard()"
          class="max-w-xl mx-auto py-12 px-6 text-center"
        >
          <i class="ph ph-globe text-4xl text-[var(--text-tertiary)] mb-3 block"></i>
          <h3 class="font-semibold text-base mb-1" x-text="book?.title"></h3>
          <p class="text-sm text-[var(--text-tertiary)] mb-1" x-text="book?.domain"></p>
          <p class="text-sm text-[var(--text-secondary)] mb-5">
            This site blocks automatic extraction, so it was saved as a link.
          </p>
          <a
            :href="book?.source_url"
            target="_blank"
            rel="noopener"
            class="btn btn-primary btn-xs px-5 py-2"
          >
            <i class="ph ph-arrow-square-out text-sm"></i>
            <span class="ml-1.5 text-xs">Open original</span>
          </a>
        </div>

        <!-- Article view: formatted HTML with pictures (sandboxed iframe —
             scripts/trackers cannot run; styling comes from the snapshot).
             x-if (not x-show): the frame only exists in article view, so it
             never loads — or logs sandbox blocks — while hidden. -->
        <template x-if="!isLoading && !isLinkCard() && hasArticle() && readerView === 'article'">
          <iframe
            :src="articleUrl()"
            sandbox=""
            referrerpolicy="no-referrer"
            title="Article"
            class="flex-1 min-h-0 w-full border-0 bg-white"
          ></iframe>
        </template>

        <div
          x-show="!isLoading && !isLinkCard() && (!hasArticle() || readerView === 'tts')"
          class="max-w-3xl mx-auto py-4 px-6 overflow-y-auto max-h-full w-full"
        >
        <div
          x-show="isLoading"
          class="flex items-center justify-center h-32 text-[var(--text-tertiary)]"
        >
          <i class="ph ph-spinner-gap animate-spin text-2xl"></i>
          <span class="ml-2">Loading book…</span>
        </div>
        <p
          x-show="!isLoading && !sentences.length"
          class="text-center text-[var(--text-tertiary)] py-8 px-4"
        >
          No content extracted from this book.
        </p>
        <template x-for="(s, i) in sentences" :key="i">
          <p
            class="leading-snug mb-1 px-3 py-1.5 rounded-lg text-sm"
            :class="{
              'bg-[var(--accent-primary-light)] text-[var(--accent-primary)] font-medium ring-1 ring-[var(--accent-primary)]/40':
                isCurrent(i),
              'text-[var(--text-tertiary)]': isPast(i),
            }"
            x-text="sentenceText(i)"
          >          </p>
        </template>
        </div>
      </div>
    </div>

    <!-- Outline sidebar (PDF only). outlineItems is reactive data set
         after getOutline() resolves, so rows appear when the panel
         opens; the raw destination refs stay out of Alpine (indexed
         identically via _gotoOutlineItemAt). Page numbers are resolved
         asynchronously and patched in per row. -->
    <div
      x-show="outlineOpen && book?.file_type === 'pdf'"
      class="w-80 flex-shrink-0 overflow-y-auto border-l border-[var(--border-primary)] bg-[var(--bg-secondary)]"
    >
      <div class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-[var(--text-tertiary)] border-b border-[var(--border-primary)]">
        Outline
      </div>
      <div class="py-1">
        <template x-for="(item, i) in outlineItems" :key="i">
          <button
            @click="_gotoOutlineItemAt(i)"
            class="flex items-center gap-2 w-full text-left px-3 py-1.5 text-sm hover:bg-[var(--bg-tertiary)]"
            :style="`padding-left: ${0.75 + item.depth * 0.75}rem`"
            :title="item.page ? item.title + ' (page ' + item.page + ')' : item.title"
          >
            <span class="flex-1 min-w-0 truncate" x-text="item.title"></span>
            <span
              x-show="item.page"
              class="flex-shrink-0 text-xs tabular-nums text-[var(--text-tertiary)]"
              x-text="item.page"
            ></span>
          </button>
        </template>
        <div
          x-show="outlineEmpty"
          class="px-3 py-4 text-sm text-[var(--text-tertiary)]"
        >
          This PDF has no outline.
        </div>
      </div>
    </div>
  </div>
</div>
