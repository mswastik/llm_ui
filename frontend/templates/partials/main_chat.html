<!-- ═══════════ MAIN CHAT AREA ═══════════ -->
<main
  class="flex-1 flex flex-col min-w-0 bg-[var(--bg-primary)] relative"
  x-data="chat"
  x-init="init()"
  @dragenter.prevent="handleDragEnter()"
  @dragover.prevent
  @dragleave="handleDragLeave()"
  @drop.prevent="handleDrop($event)"
>
  <!-- Drag & Drop Overlay -->
  <div
    x-show="dragOver"
    x-cloak
    class="absolute inset-0 z-[60] flex items-center justify-center pointer-events-none"
  >
    <div class="flex flex-col items-center gap-3 px-8 py-10 rounded-2xl bg-[var(--bg-secondary)]/90 border-2 border-dashed border-[var(--accent-primary)] shadow-xl">
      <i class="ph ph-cloud-arrow-up text-4xl text-[var(--accent-primary)]"></i>
      <span class="text-sm font-medium text-[var(--text-primary)]">Drop files to attach</span>
      <span class="text-xs text-[var(--text-tertiary)]">Attach files to your message</span>
    </div>
  </div>

  <!-- Messages Container -->
  <div id="messages-container" class="flex-1 overflow-y-auto overflow-x-hidden">
    <div class="mx-auto w-full px-3">
      <!-- Conversation Title (inline, subtle) -->
      <div class="pt-4 pb-1">
        <input
          :value="$store.chat.currentConversationTitle"
          @change="updateTitle($event)"
          class="w-full text-center text-[0.8rem] font-medium text-[var(--text-tertiary)] bg-transparent border-none outline-none hover:text-[var(--text-secondary)] focus:text-[var(--text-primary)] transition-colors"
          placeholder="Untitled conversation"
        />
      </div>

      <!-- Context transparency panel (Phase 6) -->
      <div class="flex justify-center pb-1">
        <button
          @click="contextOpen = !contextOpen"
          class="flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full transition-colors"
          :class="contextOpen ? 'bg-[var(--accent-primary)] text-white' : 'bg-[var(--bg-tertiary)] text-[var(--text-tertiary)] hover:text-[var(--text-primary)]'"
          title="What the model sees this turn"
        >
          <i class="ph ph-eye text-xs"></i>
          <span x-text="contextOpen ? 'Hide context' : 'What the model sees'"></span>
        </button>
      </div>
      <div x-show="contextOpen" x-cloak x-collapse class="mb-2">
        <div class="rounded-lg bg-[var(--bg-tertiary)] border border-[var(--border-primary)] p-3 space-y-2 text-xs">
          <template x-if="!contextInfo">
            <p class="text-[var(--text-tertiary)]">No context info yet — send a message first.</p>
          </template>
          <template x-if="contextInfo">
            <div class="space-y-2">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-medium text-[var(--text-secondary)]">Model:</span>
                <span class="text-[var(--text-primary)]" x-text="contextInfo.model"></span>
                <span class="ml-auto text-[var(--text-tertiary)]">
                  <span x-text="contextInfo.message_count"></span> messages · <span x-text="contextInfo.tool_count"></span> tools
                </span>
              </div>
              <template x-if="contextInfo.tools?.length">
                <div class="flex flex-wrap gap-1">
                  <template x-for="t in contextInfo.tools" :key="t">
                    <span class="badge badge-primary text-[10px]" x-text="t"></span>
                  </template>
                </div>
              </template>
              <div>
                <div class="font-medium text-[var(--text-secondary)] mb-1">System prompt (what the model sees)</div>
                <pre class="bg-[var(--bg-code)] rounded-md p-2 text-[11px] text-[var(--text-code)] overflow-x-auto whitespace-pre-wrap max-h-64 overflow-y-auto" x-text="contextInfo.system_prompt"></pre>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Messages -->
      <div class="py-0 space-y-5">
        <!-- Empty State -->
        <div x-show="messages.length === 0" class="empty-state">
          <div class="empty-state-icon">
            <i class="ph ph-robot text-3xl"></i>
          </div>
          <h2 class="text-xl font-semibold mb-2 text-[var(--text-primary)]">
            How can I help you today?
          </h2>
          <p class="text-sm max-w-md mb-8 text-[var(--text-secondary)]">
            Pick a model and agent in the composer below, attach documents from
            your knowledge base, and manage MCP servers and their tools right
            from the chat box.
          </p>
          <div class="flex flex-wrap gap-2 justify-center">
            <button
              @click="inputMessage = 'What can you help me with?'"
              class="pill pill-default"
            >
              💡 What can you help me with?
            </button>
            <button
              @click="inputMessage = 'Explain how LLMs work'"
              class="pill pill-default"
            >
              🧠 Explain how LLMs work
            </button>
            <button
              @click="inputMessage = 'Help me write code'"
              class="pill pill-default"
            >
              💻 Help me write code
            </button>
          </div>
        </div>

        <!-- Messages -->
        <template x-for="(message, msgIndex) in messages" :key="message.id">
          <!-- Flex row: justify-end pushes user bubbles right, justify-start pushes assistant left -->
          <div
            class="message-enter group flex items-start gap-2.5"
            :class="message.role === 'user' ? 'justify-end' : 'justify-start'"
          >
            <!-- Assistant avatar -->
            <template x-if="message.role === 'assistant'">
              <div class="msg-avatar">
                <i class="ph ph-robot"></i>
              </div>
            </template>

            <div
              class="max-w-[85%] min-w-0"
              :class="message.role === 'user' ? 'message-user' : 'message-assistant'"
            >
              <!-- Content wrapper: keeps width/height stable by always having content in layout -->
              <div style="position: relative;">
                <!-- Message Content (always in DOM — opacity hides it during edit without losing layout space) -->
                <div class="p-4 pb-2" :class="[
                  editingMessageId === message.id ? 'opacity-0 pointer-events-none' : '',
                  message.files?.length > 0 ? 'pt-2' : ''
                ]">
                  <template
                    x-if="message.role === 'user' && message.files?.length > 0"
                  >
                    <div class="flex flex-wrap gap-2 -mt-2 pb-2">
                      <template x-for="(f, fi) in message.files" :key="'uf-' + fi">
                        <div class="contents">
                        <template x-if="f.type?.startsWith('image/')">
                          <a :href="f.url" target="_blank" class="block rounded-lg overflow-hidden border border-white/20 hover:opacity-90 transition-opacity max-w-[200px]">
                            <img :src="f.url" :alt="f.filename" class="w-full h-auto object-cover max-h-[200px]" loading="lazy" />
                          </a>
                        </template>
                        <template x-if="!f.type?.startsWith('image/')">
                          <a :href="f.url" target="_blank" class="flex items-center gap-1.5 bg-white/15 rounded-md px-2 py-1.5 text-xs text-white/80 hover:text-white hover:bg-white/25 transition-colors">
                            <i :class="'ph ' + getFileIcon(f.type) + ' text-sm'"></i>
                            <span class="truncate max-w-[100px]" x-text="f.filename"></span>
                            <span class="opacity-60 flex-shrink-0" x-text="formatFileSize(f.size)"></span>
                          </a>
                        </template>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- Version Pills -->
                  <template
                    x-if="message.role === 'assistant' && message.version_group && (message.max_version || message.version) > 1"
                  >
                    <div class="mb-2 flex items-center gap-1.5">
                      <span class="text-xs text-[var(--text-tertiary)]">versions:</span>
                      <template
                        x-for="v in Array.from({length: message.max_version || message.version}, (_, i) => i + 1)"
                        :key="'v-' + message.id + '-' + v"
                      >
                        <button
                          @click="switchVersion(message.id, v)"
                          class="badge text-xs cursor-pointer transition-all"
                          :class="v === message.version ? 'badge-primary' : 'bg-[var(--bg-tertiary)] text-[var(--text-tertiary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)]'"
                          x-text="'v' + v"
                        ></button>
                      </template>
                    </div>
                  </template>

                  <!-- Model Badge + Performance Metrics -->
                  <template x-if="message.role === 'assistant' && (message.metadata?.model || getMetrics(message))">
                    <div class="mb-2 flex items-center gap-2 flex-wrap">
                      <template x-if="message.metadata?.model">
                        <span class="badge badge-primary" x-text="message.metadata.model"></span>
                      </template>
                      <!-- Inline short label (tok/s · TTFT) -->
                      <template x-if="metricsShortLabel(message)">
                        <span class="text-xs text-[var(--text-tertiary)]" x-text="'· ' + metricsShortLabel(message)" :title="metricsTooltip(message)"></span>
                      </template>
                      <!-- Hover details card -->
                      <div x-data="{ open: false }" @mouseenter="open = true" @mouseleave="open = false" class="relative">
                        <button x-show="getMetrics(message)" type="button" class="text-xs text-[var(--text-tertiary)] hover:text-[var(--text-primary)] flex items-center gap-0.5" title="Performance details">
                          <i class="ph ph-chart-bar text-[11px]"></i>
                          <i class="ph ph-caret-down text-[10px]" :class="open ? 'rotate-180' : ''" style="transition: transform 0.15s"></i>
                        </button>
                        <div x-show="open" x-cloak x-transition.opacity
                             class="absolute left-0 top-full mt-1.5 z-30 w-64 rounded-md border border-[var(--border)] bg-[var(--bg-primary)] shadow-xl p-3 text-xs leading-4">
                          <div class="font-semibold text-[var(--text-primary)] mb-1.5 flex items-center gap-1"><i class="ph ph-lightning"></i> Performance</div>
                          <div class="space-y-1">
                            <div class="flex justify-between" x-show="getMetrics(message)?.prompt_tokens != null"><span class="text-[var(--text-tertiary)]">Prompt</span><span class="font-mono text-[var(--text-primary)]" x-text="(getMetrics(message)?.prompt_tokens ?? '—') + ' tok' + (getMetrics(message)?.cached_tokens ? ' (' + getMetrics(message).cached_tokens + ' cached)' : '')"></span></div>
                            <div class="flex justify-between" x-show="getMetrics(message)?.completion_tokens != null"><span class="text-[var(--text-tertiary)]">Completion</span><span class="font-mono text-[var(--text-primary)]" x-text="(getMetrics(message)?.completion_tokens ?? '—') + ' tok'"></span></div>
                            <div class="flex justify-between" x-show="getMetrics(message)?.total_tokens != null"><span class="text-[var(--text-tertiary)]">Total</span><span class="font-mono text-[var(--text-primary)]" x-text="(getMetrics(message)?.total_tokens ?? '—') + ' tok'"></span></div>
                            <div class="border-t border-[var(--border)] my-1"></div>
                            <div class="flex justify-between" x-show="getMetrics(message)?.tokens_per_second != null"><span class="text-[var(--text-tertiary)]">Speed</span><span class="font-mono text-[var(--text-primary)]" x-text="formatTps(getMetrics(message)) || '—'"></span></div>
                            <div class="flex justify-between" x-show="getMetrics(message)?.prompt_per_second != null"><span class="text-[var(--text-tertiary)]">Prompt speed</span><span class="font-mono text-[var(--text-primary)]" x-text="getMetrics(message)?.prompt_per_second ? (getMetrics(message).prompt_per_second >= 10 ? Math.round(getMetrics(message).prompt_per_second) : getMetrics(message).prompt_per_second.toFixed(1)) + ' tok/s' : '—'"></span></div>
                            <div class="flex justify-between" x-show="getMetrics(message)?.ttft_ms != null"><span class="text-[var(--text-tertiary)]">TTFT</span><span class="font-mono text-[var(--text-primary)]" x-text="formatDuration(getMetrics(message)?.ttft_ms) || '—'"></span></div>
                            <div class="flex justify-between" x-show="getMetrics(message)?.total_duration_ms != null"><span class="text-[var(--text-tertiary)]">Duration</span><span class="font-mono text-[var(--text-primary)]" x-text="formatDuration(getMetrics(message)?.total_duration_ms) || '—'"></span></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                  <!-- Sequential Blocks -->
                  <template x-if="message.blocks?.length > 0">
                    <div class="space-y-2">
                      <template
                        x-for="(block, blockIdx) in message.blocks"
                        :key="'b-' + blockIdx"
                      >
                        <div>
                          <!-- Content Block -->
                          <div x-show="block.type === 'content'" class="prose">
                            <div
                              x-html="renderWithCitations(block.content, extractSources(message.blocks))"
                            ></div>
                          </div>

                          <!-- Thinking Block -->
                          <div
                            x-show="block.type === 'thinking'"
                            class="thinking-block overflow-hidden"
                          >
                            <div
                              @click="toggleBlock('thinking-' + message.id + '-' + blockIdx)"
                              class="thinking-header flex items-center gap-2 px-3 py-1.5 text-sm"
                            >
                              <i
                                class="ph ph-caret-right text-base transition-transform duration-200"
                                :class="isExpanded('thinking-' + message.id + '-' + blockIdx) ? 'rotate-90' : ''"
                              ></i>
                              <i
                                class="ph ph-brain text-base text-[var(--thinking-accent)]"
                              ></i>
                              <span
                                class="font-medium text-sm text-[var(--thinking-text)]"
                                >Thinking</span
                              >
                              <span
                                class="text-xs text-[var(--text-tertiary)]"
                                x-text="(block.content?.length || 0) + ' chars'"
                              ></span>
                            </div>
                            <div
                              x-show="isExpanded('thinking-' + message.id + '-' + blockIdx)"
                              x-collapse
                            >
                              <div
                                class="px-3 pb-3 text-sm prose"
                                x-html="renderMarkdown(block.content || '')"
                              ></div>
                            </div>
                          </div>

                          <!-- Tool Call Block -->
                          <!-- Pinned approval banner (visible without expanding) -->
                          <div
                            x-show="block.type === 'tool_call' && block.status === 'approval'"
                            class="mb-2 rounded-md border border-amber-300 bg-amber-50 px-3 py-2"
                          >
                            <div class="flex items-start justify-between gap-2">
                              <div class="min-w-0">
                                <div class="text-xs font-semibold text-amber-800 flex items-center gap-1">
                                  <i class="ph ph-warning-circle"></i> Needs approval
                                </div>
                                <pre class="mt-1 bg-black rounded p-1.5 text-xs text-[var(--text-code)] overflow-x-auto whitespace-pre-wrap" x-text="block.command"></pre>
                                <div x-show="block.working_dir" class="text-[11px] text-amber-700 mt-1">Dir: <span x-text="block.working_dir"></span></div>
                                <div x-show="block.approval_reason" class="text-[11px] text-amber-700 mt-1" x-text="block.approval_reason"></div>
                              </div>
                              <div class="flex gap-1.5 flex-shrink-0">
                                <button type="button" @click="respondApproval(block, true)" class="btn btn-primary btn-sm">Approve</button>
                                <button type="button" @click="respondApproval(block, false)" class="btn btn-secondary btn-sm">Deny</button>
                              </div>
                            </div>
                          </div>
                          <div
                            x-show="block.type === 'tool_call'"
                            class="tool-block overflow-hidden"
                          >
                            <div
                              @click="toggleBlock('tool-' + message.id + '-' + blockIdx)"
                              class="tool-header flex items-center gap-2 px-3 py-1.5 text-sm"
                            >
                              <i
                                class="ph ph-caret-right text-base transition-transform duration-200"
                                :class="isExpanded('tool-' + message.id + '-' + blockIdx) ? 'rotate-90' : ''"
                              ></i>
                              <i
                                class="ph ph-gear text-base text-[var(--tool-accent)]"
                              ></i>
                              <span
                                class="font-medium text-sm text-[var(--tool-text)]"
                                x-text="block.name || 'Tool'"
                              ></span>
                              <template x-if="block.status === 'completed'">
                                <span class="badge badge-success text-xs"
                                  >Done</span
                                >
                              </template>
                              <template x-if="block.status === 'error'">
                                <span class="badge badge-error text-xs"
                                  >Error</span
                                >
                              </template>
                              <template
                                x-if="block.status === 'starting' || block.status === 'running'"
                              >
                                <span
                                  class="badge badge-warning text-xs animate-pulse"
                                  >Running</span
                                >
                              </template>
                              <template x-if="block.status === 'approval'">
                                <span
                                  class="badge badge-warning text-xs animate-pulse"
                                  >Needs approval</span
                                >
                              </template>
                            </div>
                            <div
                              x-show="isExpanded('tool-' + message.id + '-' + blockIdx)"
                              x-collapse
                            >
                              <div class="px-3 pb-3 space-y-3">
                                <!-- Args -->
                                <template
                                  x-if="block.arguments && Object.keys(block.arguments).length > 0"
                                >
                                  <div>
                                    <div
                                      class="flex items-center justify-between mb-1"
                                    >
                                      <span
                                        class="text-xs text-[var(--text-tertiary)]"
                                        >Arguments</span
                                      >
                                      <template
                                        x-if="argsText(block.arguments, 'args-' + message.id + '-' + blockIdx).length > 2000"
                                      >
                                        <button
                                          @click="toggleBlock('args-' + message.id + '-' + blockIdx)"
                                          class="text-xs text-[var(--accent-primary)] hover:underline"
                                        >
                                          <span
                                            x-text="isExpanded('args-' + message.id + '-' + blockIdx) ? 'Collapse' : 'Show full'"
                                          ></span>
                                        </button>
                                      </template>
                                    </div>
                                    <pre
                                      class="bg-[var(--bg-code)] rounded-md p-2 text-xs text-[var(--text-code)] overflow-x-auto whitespace-pre-wrap"
                                      x-text="argsText(block.arguments, 'args-' + message.id + '-' + blockIdx)"
                                    ></pre>
                                  </div>
                                </template>

                                <!-- Command Approval (run_command) -->
                                <template x-if="block.status === 'approval'">
                                  <div class="space-y-2">
                                    <div
                                      class="text-xs text-[var(--text-tertiary)]"
                                    >
                                      Command
                                    </div>
                                    <pre
                                      class="bg-[var(--bg-code)] rounded-md p-2 text-xs text-[var(--text-code)] overflow-x-auto whitespace-pre-wrap"
                                      x-text="block.command"
                                    ></pre>
                                    <template x-if="block.working_dir">
                                      <div
                                        class="text-xs text-[var(--text-tertiary)]"
                                      >
                                        Working dir: <span x-text="block.working_dir"></span>
                                      </div>
                                    </template>
                                    <template x-if="block.approval_reason">
                                      <div
                                        class="text-xs text-[var(--text-secondary)]"
                                        x-text="block.approval_reason"
                                      ></div>
                                    </template>
                                    <div class="flex gap-2">
                                      <button
                                        type="button"
                                        @click="respondApproval(block, true)"
                                        class="btn btn-primary btn-sm"
                                      >
                                        Approve
                                      </button>
                                      <button
                                        type="button"
                                        @click="respondApproval(block, false)"
                                        class="btn btn-secondary btn-sm"
                                      >
                                        Deny
                                      </button>
                                    </div>
                                  </div>
                                </template>

                                <!-- Search Steps (search_web) -->
                                <template
                                  x-if="block.name === 'search_web' && block.search_steps?.length > 0"
                                >
                                  <div class="space-y-2">
                                    <div
                                      class="font-medium text-sm text-[var(--tool-text)]"
                                    >
                                      Search Steps
                                    </div>
                                    <template
                                      x-for="(step, si) in block.search_steps"
                                      :key="si"
                                    >
                                      <div
                                        class="bg-[var(--bg-tertiary)] border border-[var(--tool-border)] rounded-md p-2.5 text-xs"
                                      >
                                        <div class="flex items-center gap-2 mb-1">
                                          <span
                                            class="badge badge-primary"
                                            x-text="'Step ' + (si + 1)"
                                          ></span>
                                          <span
                                            class="text-[var(--text-primary)]"
                                            x-text="step.query"
                                          ></span>
                                        </div>
                                        <div
                                          class="flex gap-3 text-[var(--text-tertiary)]"
                                        >
                                          <span
                                            x-text="'📄 ' + (step.sources_found || 0) + ' sources'"
                                          ></span>
                                          <span
                                            x-text="'📝 ' + (step.chunks_created || 0) + ' chunks'"
                                          ></span>
                                        </div>
                                        <template x-if="step.reasoning">
                                          <div
                                            class="mt-1.5 pt-1.5 border-t border-[var(--tool-border)]"
                                          >
                                            <span
                                              class="text-[var(--thinking-accent)] font-medium"
                                              >Analysis:</span
                                            >
                                            <span
                                              class="text-[var(--text-primary)] ml-1"
                                              x-text="step.reasoning"
                                            ></span>
                                          </div>
                                        </template>
                                      </div>
                                    </template>
                                  </div>
                                </template>

                                <!-- Result Preview -->
                                <template x-if="block.result">
                                  <div>
                                    <div
                                      class="font-medium text-sm mb-2 flex items-center justify-between gap-1.5"
                                      :class="(block.status === 'error' || (toolResultView(block.result).kind === 'command' && !toolResultView(block.result).ok)) ? 'text-[var(--error)]' : 'text-[var(--success)]'"
                                    >
                                      <span class="flex items-center gap-1.5">
                                        <i
                                          class="ph"
                                          :class="(block.status === 'error' || (toolResultView(block.result).kind === 'command' && !toolResultView(block.result).ok)) ? 'ph-x-circle' : 'ph-check-circle'"
                                        ></i>
                                        Result
                                      </span>
                                      <button
                                        @click="copyText((toolResultView(block.result).stdout || toolResultView(block.result).stderr || toolResultView(block.result).body))"
                                        class="text-xs font-normal text-[var(--text-tertiary)] hover:text-[var(--text-primary)] flex items-center gap-1"
                                        title="Copy output"
                                      >
                                        <i class="ph ph-copy"></i> Copy
                                      </button>
                                    </div>

                                    <!-- Search Web Result -->
                                    <template x-if="block.name === 'search_web'">
                                      <div class="space-y-2">
                                        <template x-if="block.result.content">
                                          <div
                                            class="bg-[var(--bg-tertiary)] border border-[var(--tool-border)] rounded-md p-2.5"
                                          >
                                            <div
                                              class="text-xs text-[var(--text-tertiary)] mb-1"
                                            >
                                              Summary
                                            </div>
                                            <div
                                              class="text-[var(--text-primary)] text-xs whitespace-pre-wrap"
                                              x-text="parseEscapes(block.result.content?.substring(0, 500) + (block.result.content?.length > 500 ? '...' : ''))"
                                            ></div>
                                          </div>
                                        </template>
                                        <template x-if="block.result.sources">
                                          <div
                                            class="text-xs text-[var(--text-tertiary)]"
                                          >
                                            <span
                                              x-text="block.result.sources.length + ' sources found'"
                                            ></span>
                                          </div>
                                        </template>
                                      </div>
                                    </template>

                                    <!-- Query Documents Result -->
                                    <template
                                      x-if="block.name === 'query_documents'"
                                    >
                                      <div class="space-y-2">
                                        <template
                                          x-if="block.result.result_count !== undefined"
                                        >
                                          <div
                                            class="text-xs text-[var(--text-tertiary)]"
                                            x-text="block.result.result_count + ' relevant passages found'"
                                          ></div>
                                        </template>
                                        <template x-if="block.result.context">
                                          <div
                                            class="bg-[var(--bg-tertiary)] border border-[var(--tool-border)] rounded-md p-2.5"
                                          >
                                            <div
                                              class="text-xs text-[var(--text-tertiary)] mb-1"
                                            >
                                              Context Preview
                                            </div>
                                            <div
                                              class="text-[var(--text-primary)] text-xs whitespace-pre-wrap"
                                              x-text="parseEscapes(block.result.context?.substring(0, 300) + (block.result.context?.length > 300 ? '...' : ''))"
                                            ></div>
                                          </div>
                                        </template>
                                      </div>
                                    </template>

                                    <!-- Generic Result -->
                                    <template
                                      x-if="!['search_web', 'query_documents'].includes(block.name)"
                                    >
                                      <div class="space-y-2">
                                        <!-- Asset preview (files written to outputs/ or uploads/) -->
                                        <template
                                          x-if="assetPreviews(toolResultView(block.result).body || toolResultView(block.result).stdout).length > 0"
                                        >
                                          <div class="flex flex-wrap gap-2">
                                            <template
                                              x-for="(asset, ai) in assetPreviews(toolResultView(block.result).body || toolResultView(block.result).stdout)"
                                              :key="ai"
                                            >
                                              <a
                                                :href="asset.src"
                                                target="_blank"
                                                rel="noopener"
                                                class="block"
                                              >
                                                <img
                                                  :src="asset.src"
                                                  :alt="asset.src"
                                                  class="max-h-56 rounded-md border border-[var(--tool-border)]"
                                                />
                                              </a>
                                            </template>
                                          </div>
                                        </template>

                                        <!-- Status line (run_command: exit code + duration) -->
                                        <template
                                          x-if="toolResultView(block.result).summary"
                                        >
                                          <span
                                            class="badge text-xs"
                                            :class="toolResultView(block.result).ok ? 'badge-success' : 'badge-error'"
                                            x-text="toolResultView(block.result).summary"
                                          ></span>
                                        </template>

                                        <!-- Command (run_command) -->
                                        <template
                                          x-if="toolResultView(block.result).kind === 'command' && block.arguments?.command"
                                        >
                                          <div>
                                            <div
                                              class="text-xs text-[var(--text-tertiary)] mb-1"
                                            >
                                              Command
                                            </div>
                                            <pre
                                              class="bg-[var(--bg-code)] rounded-md p-2 text-xs text-[var(--text-code)] overflow-x-auto whitespace-pre-wrap font-mono"
                                            ><span class="text-[var(--accent-primary)] font-semibold">$ </span><span x-text="block.arguments.command"></span></pre>
                                          </div>
                                        </template>

                                        <!-- stdout -->
                                        <template
                                          x-if="toolResultView(block.result).stdout"
                                        >
                                          <div>
                                            <div
                                              class="text-xs text-[var(--text-tertiary)] mb-1"
                                            >
                                              Output
                                            </div>
                                            <pre
                                              class="bg-[var(--bg-code)] rounded-md p-2 text-xs text-[var(--text-code)] overflow-x-auto whitespace-pre-wrap font-mono"
                                              x-html="smartText(toolResultView(block.result).stdout)"
                                            ></pre>
                                          </div>
                                        </template>

                                        <!-- stderr -->
                                        <template
                                          x-if="toolResultView(block.result).stderr"
                                        >
                                          <div>
                                            <div
                                              class="text-xs text-[var(--error)] mb-1"
                                            >
                                              stderr
                                            </div>
                                            <pre
                                              class="bg-[var(--bg-code)] rounded-md p-2 text-xs text-[var(--error)] overflow-x-auto whitespace-pre-wrap font-mono"
                                              x-html="smartText(toolResultView(block.result).stderr)"
                                            ></pre>
                                          </div>
                                        </template>

                                        <!-- Body (MCP text / plain text / pretty JSON) -->
                                        <template
                                          x-if="toolResultView(block.result).body"
                                        >
                                          <pre
                                            class="bg-[var(--bg-code)] rounded-md p-2 text-xs text-[var(--text-code)] overflow-x-auto whitespace-pre-wrap font-mono"
                                            x-html="smartText(toolResultView(block.result).body)"
                                          ></pre>
                                        </template>
                                      </div>
                                    </template>
                                  </div>
                                </template>

                                <!-- Error -->
                                <template x-if="block.status === 'error'">
                                  <div
                                    class="text-[var(--error)] text-xs whitespace-pre-wrap"
                                    x-text="block.result?.error || 'Unknown error'"
                                  ></div>
                                </template>
                              </div>
                            </div>
                          </div>

                          <!-- Auto Action Block (visible autonomous actions: memory/skill/title/jobs) -->
                          <div
                            x-show="block.type === 'auto_action'"
                            class="auto-action-block overflow-hidden rounded-md border"
                            :class="{
                              'border-[var(--border-primary)] bg-[var(--bg-tertiary)]': block.status === 'completed',
                              'border-amber-200 bg-amber-50/50': block.status === 'running',
                              'border-[var(--border-primary)] bg-[var(--bg-primary)] opacity-70': block.status === 'skipped',
                              'border-red-200 bg-red-50/50': block.status === 'error'
                            }"
                          >
                            <div
                              @click="toggleBlock('auto-' + message.id + '-' + blockIdx)"
                              class="auto-action-header flex items-center gap-2 px-3 py-2 text-sm cursor-pointer select-none"
                            >
                              <i
                                class="ph text-base"
                                :class="{
                                  'ph-check-circle text-[var(--success)]': block.status === 'completed',
                                  'ph-spinner animate-spin text-amber-600': block.status === 'running',
                                  'ph-minus-circle text-[var(--text-tertiary)]': block.status === 'skipped',
                                  'ph-x-circle text-[var(--error)]': block.status === 'error',
                                  'ph-brain': block.action === 'memory' && block.status !== 'running' && block.status !== 'completed' && block.status !== 'error',
                                  'ph-lightbulb': block.action === 'skill' && block.status !== 'running' && block.status !== 'completed' && block.status !== 'error',
                                  'ph-tag': block.action === 'title' && block.status !== 'running' && block.status !== 'completed' && block.status !== 'error',
                                  'ph-briefcase': block.action === 'jobs' && block.status !== 'running' && block.status !== 'completed' && block.status !== 'error'
                                }"
                              ></i>
                              <!-- Running uses spinner, completed uses check, pick action icon otherwise -->
                              <template x-if="block.status === 'running'">
                                <i class="ph ph-spinner animate-spin text-amber-600 text-base"></i>
                              </template>
                              <template x-if="block.status === 'completed' && block.action === 'memory'">
                                <i class="ph ph-brain text-base text-[var(--success)]"></i>
                              </template>
                              <template x-if="block.status === 'completed' && block.action === 'skill'">
                                <i class="ph ph-lightbulb text-base text-[var(--success)]"></i>
                              </template>
                              <template x-if="block.status === 'completed' && block.action === 'title'">
                                <i class="ph ph-tag text-base text-[var(--success)]"></i>
                              </template>
                              <template x-if="block.status === 'completed' && block.action === 'jobs'">
                                <i class="ph ph-briefcase text-base text-[var(--success)]"></i>
                              </template>
                              <span class="font-medium text-xs uppercase tracking-wide text-[var(--text-secondary)]" x-text="block.action"></span>
                              <span class="text-sm text-[var(--text-primary)] truncate" x-text="
                                block.action === 'memory' && block.status === 'completed' ? `Saved ${block.detail?.count || 0} fact(s)` :
                                block.action === 'memory' && block.status === 'skipped' ? 'No facts to save' :
                                block.action === 'skill' && block.status === 'completed' ? `Draft: ${block.detail?.skill || 'skill'}` :
                                block.action === 'skill' && block.status === 'skipped' ? 'No skill needed' :
                                block.action === 'title' && block.status === 'completed' ? `Title: ${block.detail?.title || ''}` :
                                block.action === 'title' && block.status === 'skipped' ? 'Title unchanged' :
                                block.action === 'jobs' && block.status === 'completed' ? `${block.detail?.count || 0} job(s) finalized` :
                                block.status === 'running' ? 'Running…' :
                                block.status === 'error' ? 'Error' :
                                block.status
                              "></span>
                              <span class="ml-auto flex items-center gap-1.5">
                                <template x-if="block.status === 'completed'"><span class="badge badge-success text-[10px]">done</span></template>
                                <template x-if="block.status === 'running'"><span class="badge badge-warning text-[10px] animate-pulse">running</span></template>
                                <template x-if="block.status === 'skipped'"><span class="badge bg-[var(--bg-tertiary)] text-[var(--text-tertiary)] text-[10px]">skipped</span></template>
                                <template x-if="block.status === 'error'"><span class="badge badge-error text-[10px]">error</span></template>
                                <i class="ph ph-caret-right text-xs transition-transform" :class="isExpanded('auto-' + message.id + '-' + blockIdx) ? 'rotate-90' : ''"></i>
                              </span>
                            </div>
                            <div x-show="isExpanded('auto-' + message.id + '-' + blockIdx)" x-collapse>
                              <div class="px-3 pb-3 space-y-2">
                                <!-- Memory detail -->
                                <template x-if="block.action === 'memory'">
                                  <div class="space-y-1.5">
                                    <template x-if="block.status === 'completed' && block.detail?.facts?.length">
                                      <div>
                                        <div class="text-xs text-[var(--text-tertiary)] mb-1">Facts saved (<span x-text="block.detail.scope"></span>):</div>
                                        <ul class="list-disc list-inside text-xs text-[var(--text-primary)] space-y-0.5">
                                          <template x-for="(fact, fi) in block.detail.facts" :key="fi">
                                            <li x-text="fact"></li>
                                          </template>
                                        </ul>
                                      </div>
                                    </template>
                                    <template x-if="block.status !== 'completed'">
                                      <div class="text-xs text-[var(--text-tertiary)]" x-text="block.detail?.reason || 'No detail'"></div>
                                    </template>
                                  </div>
                                </template>
                                <!-- Skill detail -->
                                <template x-if="block.action === 'skill'">
                                  <div class="space-y-1.5">
                                    <template x-if="block.status === 'completed'">
                                      <div class="text-xs space-y-1">
                                        <div><span class="text-[var(--text-tertiary)]">Skill:</span> <span class="font-medium text-[var(--text-primary)]" x-text="block.detail.skill"></span> <span class="badge badge-primary text-[10px]" x-text="block.detail.skill_action"></span></div>
                                        <div x-show="block.detail.description" class="text-[var(--text-secondary)]" x-text="block.detail.description"></div>
                                        <div x-show="block.detail.reason" class="text-[var(--text-tertiary)] italic" x-text="'— ' + block.detail.reason"></div>
                                      </div>
                                    </template>
                                    <template x-if="block.status !== 'completed'">
                                      <div class="text-xs text-[var(--text-tertiary)]" x-text="block.detail?.reason || block.detail?.raw || 'No detail'"></div>
                                    </template>
                                  </div>
                                </template>
                                <!-- Title detail -->
                                <template x-if="block.action === 'title'">
                                  <div class="text-xs text-[var(--text-tertiary)]" x-text="block.detail?.title || block.detail?.reason || 'No detail'"></div>
                                </template>
                                <!-- Jobs detail -->
                                <template x-if="block.action === 'jobs'">
                                  <div class="text-xs text-[var(--text-tertiary)]" x-text="block.status === 'completed' ? (block.detail.count + ' job(s) written to outputs/jobs/') : (block.detail?.reason || '')"></div>
                                </template>
                                <div class="text-[10px] text-[var(--text-tertiary)]" x-text="block.detail?.raw ? block.detail.raw.substring(0,300) : ''"></div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </template>
                  <!-- Message Actions at bottom of bubble -->
                   <div class="z-2 px-4 py-0 my-0 flex items-center gap-1 transition-opacity" :class="(($store.ui.isPlaying || $store.ui.isPaused) && $store.ui.currentAudioMessageId === message.id) ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'" style="margin:1px;">
                  <button
                    @click="copyMessage(message)"
                    class="ml-auto btn btn-icon btn-ghost text-xs"
                    title="Copy"
                  >
                    <i class="ph ph-copy text-sm"></i>
                  </button>
                  <template x-if="message.role === 'assistant'">
                    <button
                      @click="regenerate(message.id)"
                      class="btn btn-icon btn-ghost text-xs"
                      title="Regenerate"
                      :disabled="isLoading"
                    >
                      <i class="ph ph-arrow-clockwise text-sm"></i>
                    </button>
                  </template>
                  <template x-if="message.role === 'assistant'">
                    <!-- Single root (Alpine x-if renders only the first element) — button + slot -->
                    <div class="flex items-center gap-1">
                      <button
                        @click="handleTtsClick(message)"
                        class="btn btn-icon btn-ghost text-xs"
                        :title="$store.ui.isPlaying && $store.ui.currentAudioMessageId === message.id ? 'Pause' : ($store.ui.isPaused && $store.ui.currentAudioMessageId === message.id ? 'Resume' : 'Read aloud')"
                      >
                        <i
                          class="ph ph-speaker-high text-sm"
                          x-show="(!($store.ui.isPlaying || $store.ui.isPaused)) || $store.ui.currentAudioMessageId !== message.id"
                        ></i>
                        <i
                          class="ph ph-pause text-sm"
                          x-show="$store.ui.isPlaying && $store.ui.currentAudioMessageId === message.id"
                        ></i>
                        <i
                          class="ph ph-play text-sm"
                          x-show="$store.ui.isPaused && $store.ui.currentAudioMessageId === message.id"
                        ></i>
                      </button>
                      <!-- TTS player slot: streaming <audio controls> is injected here, inline with the read-aloud button -->
                      <div
                        :id="'tts-slot-' + message.id"
                        class="tts-slot hidden flex items-center"
                      ></div>
                    </div>
                  </template>
                  <template x-if="message.role === 'assistant' && message.content?.trim()">
                    <button
                      @click="takeNote(message)"
                      class="btn btn-icon btn-ghost text-xs"
                      title="Take note"
                    >
                      <i class="ph ph-notebook text-sm"></i>
                    </button>
                  </template>
                  <template
                    x-if="($store.ui.isPlaying || $store.ui.isPaused) && $store.ui.currentAudioMessageId === message.id"
                  >
                    <button
                      @click="stopAudio()"
                      class="py-1 px-2 btn btn-icon btn-ghost text-xs text-[var(--error)]"
                      title="Stop"
                    >
                      <i class="ph ph-fill ph-stop text-sm"></i>
                    </button>
                  </template>
                  <button
                    @click="startEdit(message.id, message.content)"
                    class="btn btn-icon btn-ghost text-xs"
                    title="Edit"
                  >
                    <i class="ph ph-pencil-simple text-sm"></i>
                  </button>
                  <button
                    @click="deleteMessage(message.id, $event)"
                    class="btn btn-icon btn-ghost text-xs"
                    title="Delete"
                  >
                    <i class="ph ph-trash text-sm"></i>
                  </button>
                </div>

                      <!-- Sources Section -->
                      <template
                        x-if="message.role === 'assistant' && extractSources(message.blocks).length > 0"
                      >
                        <div class="pt-2 border-t border-[var(--border-primary)]">
                          <button
                            @click="toggleBlock('sources-' + message.id)"
                            class="flex items-center gap-1.5 text-xs text-[var(--text-tertiary)] hover:text-[var(--text-primary)] transition-colors"
                          >
                            <i
                              class="ph ph-book-open"
                              :class="isExpanded('sources-' + message.id) ? 'rotate-90' : ''"
                            ></i>
                            <span
                              >Sources (<span
                                x-text="extractSources(message.blocks).length"
                              ></span
                              >)</span
                            >
                          </button>
                          <div
                            x-show="isExpanded('sources-' + message.id)"
                            x-collapse
                          >
                            <div
                              class="mt-2 bg-[var(--bg-tertiary)] border border-[var(--border-primary)] rounded-lg p-3 max-h-48 overflow-y-auto"
                            >
                              <ol
                                class="list-decimal list-inside space-y-1 text-xs"
                              >
                                <template
                                  x-for="(source, idx) in extractSources(message.blocks)"
                                  :key="idx"
                                >
                                  <li class="text-[var(--text-secondary)]">
                                    <a
                                      @click.prevent="handleSourceClick(source)"
                                      :href="source.url || '#'"
                                      rel="noopener"
                                      class="text-[var(--text-link)] hover:underline cursor-pointer"
                                      x-text="source.title || source.url"
                                    ></a>
                                  </li>
                                </template>
                              </ol>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- Fallback: plain content (no blocks) -->
                  <template
                    x-if="(!message.blocks || message.blocks.length === 0)"
                  >
                    <div
                      class="prose"
                      x-html="renderWithCitations(message.content, extractSources(message.blocks))"
                    ></div>
                  </template>
                </div>
                <!-- Edit Mode (absolutely positioned overlay, sibling of content — not affected by content's opacity) -->
                <div class="p-4 absolute inset-0 z-[1]" :class="{'invisible-keep-layout': editingMessageId !== message.id}">
                  <textarea
                    x-model="editContent"
                    rows="3"
                    class="input w-full text-sm resize-none"
                    placeholder="Edit your message..."
                  ></textarea>
                  <div class="flex gap-2 mt-2">
                    <button
                      @click="saveEdit(message.id)"
                      class="btn btn-primary btn-sm"
                    >
                      Save
                    </button>
                    <button
                      @click="cancelEdit()"
                      class="btn btn-secondary btn-sm"
                    >
                      Cancel
                    </button>
                  </div>
                </div>


              </div>
            </div>
          </div>
        </template>

        <!-- Streaming Indicator -->
        <template x-if="isLoading && !toolStatus.active">
          <div class="flex justify-start items-start gap-2.5">
            <div class="msg-avatar">
              <i class="ph ph-robot"></i>
            </div>
            <div class="message-assistant p-3">
              <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5">
                  <div
                    class="w-2 h-2 bg-[var(--accent-primary)] rounded-full animate-typing-dot"
                  ></div>
                  <div
                    class="w-2 h-2 bg-[var(--accent-primary)] rounded-full animate-typing-dot"
                  ></div>
                  <div
                    class="w-2 h-2 bg-[var(--accent-primary)] rounded-full animate-typing-dot"
                  ></div>
                </div>
                <button @click="cancelRequest()" class="btn btn-secondary btn-xs">
                  <i class="ph ph-fill ph-stop text-xs"></i> Stop
                </button>
              </div>
            </div>
          </div>
        </template>

        <!-- Tool Status -->
        <template x-if="toolStatus.active">
          <div class="flex justify-start items-start gap-2.5">
            <div class="msg-avatar">
              <i class="ph ph-robot"></i>
            </div>
            <div class="tool-block p-3 max-w-md">
              <div class="flex items-center gap-3">
                <i
                  class="ph ph-spinner animate-spin text-[var(--tool-accent)] text-lg"
                ></i>
                <div class="flex-1 min-w-0">
                  <div
                    class="font-medium text-sm text-[var(--tool-text)]"
                    x-text="toolStatus.tool"
                  ></div>
                  <div
                    class="text-xs text-[var(--text-tertiary)]"
                    x-text="toolStatus.status"
                  ></div>
                  <template x-if="toolStatus.progress !== null">
                    <div class="progress-bar mt-2">
                      <div
                        class="progress-bar-fill"
                        :style="`width: ${toolStatus.progress}%`"
                      ></div>
                    </div>
                  </template>
                </div>
                <button @click="cancelRequest()" class="btn btn-secondary btn-xs">
                  <i class="ph ph-x text-xs"></i>
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ═══════════ COMPOSER ═══════════ -->
  <div class="px-4 pb-4 pt-2 flex-shrink-0">
    <div class="max-w-[64rem] mx-auto w-full">
      <!-- File Preview Bar -->
      <template x-if="attachedFiles.length > 0">
        <div class="flex flex-wrap gap-1.5 mb-1.5 px-0.5">
          <template x-for="(file, idx) in attachedFiles" :key="'file-' + idx">
            <div class="relative group flex items-center gap-1 bg-[var(--bg-tertiary)] border border-[var(--border-primary)] rounded-md px-1.5 py-1 text-xs max-w-[180px]">
              <!-- Image thumbnail -->
              <template x-if="file.preview">
                <img :src="file.preview" class="w-5 h-5 rounded object-cover flex-shrink-0" />
              </template>
              <template x-if="!file.preview">
                <i :class="'ph ' + getFileIcon(file.type) + ' text-sm text-[var(--text-tertiary)] flex-shrink-0'"></i>
              </template>
              <div class="min-w-0 flex-1 leading-tight">
                <div class="truncate font-medium text-[10px]" x-text="file.filename"></div>
                <div class="text-[var(--text-tertiary)] text-[10px]" x-text="formatFileSize(file.size)"></div>
              </div>
              <!-- Uploading spinner -->
              <template x-if="file.uploading">
                <i class="ph ph-spinner animate-spin text-xs text-[var(--accent-primary)]"></i>
              </template>
              <!-- Remove button -->
              <button @click="removeFile(idx)" class="btn btn-icon btn-ghost p-0 absolute -top-1 -right-1 bg-[var(--bg-secondary)] border border-[var(--border-primary)] rounded-full shadow-sm opacity-0 group-hover:opacity-100 transition-opacity" title="Remove" style="width:14px;height:14px;min-width:0">
                <i class="ph ph-x text-[10px]"></i>
              </button>
            </div>
          </template>
        </div>
      </template>

      <div class="composer">
        <!-- Composer: full-width textarea on top, controls below -->
        <form @submit.prevent="sendMessage()" class="flex flex-col px-2.5 pt-2 pb-2">
          <!-- Hidden file input -->
          <input
            type="file"
            x-ref="fileInput"
            @change="handleFileSelect($event)"
            multiple
            accept="image/*,.pdf,.doc,.docx,.txt,.md,.json,.csv,.xls,.xlsx,.py,.js,.ts,.html,.css"
            class="hidden"
          />

          <textarea
            x-model="inputMessage"
            x-ref="chatInput"
            @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); sendMessage() }"
            @focus="isFocused = true"
            @blur="isFocused = false"
            placeholder="Message… (Shift+Enter for new line)"
            class="composer-input w-full transition-[min-height] duration-200"
            :style="`min-height: ${isFocused ? '110px' : '36px'}; max-height: 200px`"
            :placeholder="isLoading && $store.chat.activeStreaming.isStreaming ? 'Message… (sending interrupts the current response)' : 'Message… (Shift+Enter for new line)'"
          ></textarea>

          <!-- Controls bar: dropdowns + actions -->
          <div class="flex items-center justify-between gap-1.5 mt-1">
            <!-- Left cluster: agent / model / docs / MCP dropdowns -->
            <div class="flex items-center gap-1.5 min-w-0">
            <!-- Agent Selector -->
            <div
              class="relative"
              x-data="{ open: false }"
              @click.outside="open = false"
              x-show="availableAgents.length > 0"
            >
              <button
                type="button"
                @click="open = !open"
                class="dropdown-btn"
                :class="selectedAgentId ? 'dropdown-btn-active' : ''"
                title="Agent"
              >
                <i class="ph ph-user text-sm"></i>
                <span class="max-w-[100px] truncate" x-text="selectedAgentName"></span>
                <i class="ph ph-caret-down text-xs"></i>
              </button>
              <div x-show="open" x-cloak class="dropdown-panel min-w-[200px]">
                <div class="max-h-[40vh] overflow-y-auto py-1">
                  <button
                    type="button"
                    @click="selectAgent(null)"
                    class="dropdown-item"
                    :class="!selectedAgentId ? 'dropdown-item-active' : ''"
                  >
                    <i class="ph ph-check text-xs" x-show="!selectedAgentId"></i>
                    <span>Default Agent</span>
                  </button>
                  <template x-for="agent in availableAgents" :key="agent.id">
                    <button
                      type="button"
                      @click="selectAgent(agent.id)"
                      class="dropdown-item"
                      :class="selectedAgentId === agent.id ? 'dropdown-item-active' : ''"
                    >
                      <i class="ph ph-check text-xs" x-show="selectedAgentId === agent.id"></i>
                      <span class="truncate" x-text="agent.name"></span>
                    </button>
                  </template>
                </div>
              </div>
            </div>

            <!-- Model Selector -->
            <div class="relative" x-data="{ open: false, search: '' }" @click.outside="open = false; search = ''">
              <button
                type="button"
                @click="open = !open"
                class="dropdown-btn"
                :class="selectedModel ? 'dropdown-btn-active' : ''"
                title="Model"
              >
                <i class="ph ph-cpu text-sm"></i>
                <span class="max-w-[130px] truncate" x-text="selectedModelName"></span>
                <i class="ph ph-caret-down text-xs"></i>
              </button>
              <div x-show="open" x-cloak class="dropdown-panel min-w-[280px]">
                <div class="px-2 py-2 border-b border-[var(--border-primary)]">
                  <input type="text" x-model="search" placeholder="Search models..." class="input text-xs w-full" @click.stop @focus="$el.select()" />
                </div>
                <div class="max-h-[40vh] overflow-y-auto py-1">
                  <template x-for="prov in availableProviders" :key="prov.id">
                    <div x-show="modelsByProvider(prov.id).filter(m => !search || (m.name || m.id).toLowerCase().includes(search.toLowerCase()) || m.id.toLowerCase().includes(search.toLowerCase())).length > 0">
                      <div class="px-3 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wide text-[var(--text-tertiary)] flex items-center gap-1.5">
                        <span class="truncate" x-text="prov.name"></span>
                        <span x-show="prov.is_default" class="badge badge-primary text-[9px]">default</span>
                      </div>
                      <template x-for="model in modelsByProvider(prov.id).filter(m => !search || (m.name || m.id).toLowerCase().includes(search.toLowerCase()) || m.id.toLowerCase().includes(search.toLowerCase()))" :key="model.id">
                        <button
                          type="button"
                          @click="selectModel(model.id); search = ''"
                          class="dropdown-item"
                          :class="selectedModel === model.id ? 'dropdown-item-active' : ''"
                        >
                          <i class="ph ph-check text-xs" x-show="selectedModel === model.id"></i>
                          <span class="truncate" x-text="model.name || model.id"></span>
                        </button>
                      </template>
                    </div>
                  </template>
                  <div x-show="availableModels.length === 0" class="px-3 py-2 text-xs text-[var(--text-tertiary)]">
                    No models available
                  </div>
                </div>
              </div>
            </div>

            <!-- Thinking Mode Selector -->
            <div class="relative" x-data="{ open: false }" @click.outside="open = false">
              <button
                type="button"
                @click="open = !open"
                class="dropdown-btn"
                :class="thinkingMode !== 'auto' ? 'dropdown-btn-active' : ''"
                title="Thinking mode"
              >
                <i :class="thinkingModeIcon + ' text-sm'"></i>
                <span x-text="thinkingModeLabel"></span>
                <i class="ph ph-caret-down text-xs"></i>
              </button>
              <div x-show="open" x-cloak class="dropdown-panel min-w-[180px]">
                <div class="py-1">
                  <template x-for="mode in thinkingModes" :key="mode.id">
                    <button
                      type="button"
                      @click="selectThinkingMode(mode.id); open = false"
                      class="dropdown-item justify-between"
                      :class="thinkingMode === mode.id ? 'dropdown-item-active' : ''"
                    >
                      <span class="flex items-center gap-1.5">
                        <i :class="mode.icon + ' text-xs'"></i>
                        <span x-text="mode.label"></span>
                      </span>
                      <span class="text-[10px] text-[var(--text-tertiary)] ml-2" x-text="mode.desc"></span>
                    </button>
                  </template>
                </div>
              </div>
            </div>

            <!-- Document Selector -->
            <div class="relative" x-data="{ open: false }" @click.outside="open = false">
              <button
                type="button"
                @click="open = !open"
                class="dropdown-btn"
                :class="selectedDocumentIds.length > 0 ? 'dropdown-btn-active' : ''"
                title="Documents"
              >
                <i class="ph ph-books text-sm"></i>
                <span x-text="selectedDocumentIds.length > 0 ? (selectedDocumentIds.includes('all') ? 'All Docs' : selectedDocumentIds.length + ' docs') : 'Docs'"></span>
                <i class="ph ph-caret-down text-xs"></i>
              </button>
              <div x-show="open" x-cloak class="dropdown-panel min-w-[220px]">
                <div class="max-h-[45vh] overflow-y-auto py-1">
                  <label class="dropdown-item cursor-pointer border-b border-[var(--border-primary)]">
                    <input type="checkbox" :checked="isDocumentSelected('all')" @change="toggleDocument('all')" class="rounded" style="accent-color: var(--accent-primary)" />
                    <span class="font-medium">All documents</span>
                  </label>
                  <template x-for="doc in documents" :key="doc.id">
                    <label class="dropdown-item cursor-pointer">
                      <input type="checkbox" :checked="isDocumentSelected(doc.id)" @change="toggleDocument(doc.id)" class="rounded" style="accent-color: var(--accent-primary)" />
                      <span class="truncate" x-text="doc.filename"></span>
                    </label>
                  </template>
                  <div x-show="documents.length === 0" class="px-3 py-3 text-xs text-[var(--text-tertiary)] text-center">
                    No documents uploaded
                  </div>
                </div>
              </div>
            </div>

            <!-- MCP Servers (multi-level: servers → tools + management) -->
            <div class="relative" x-data="{ open: false }" @click.outside="open = false">
              <button
                type="button"
                @click="open = !open"
                class="dropdown-btn"
                :class="mcpServers.some(s => s.enabled) ? 'dropdown-btn-active' : ''"
                title="MCP Servers"
              >
                <i class="ph ph-plugs-connected text-sm"></i>
                <span x-text="mcpSummary"></span>
                <i class="ph ph-caret-down text-xs"></i>
              </button>
              <div x-show="open" x-cloak class="dropdown-panel w-[340px]">
                <!-- Header -->
                <div class="flex items-center justify-between px-3 py-2 border-b border-[var(--border-primary)]">
                  <span class="text-sm font-semibold">MCP Servers</span>
                  <button type="button" @click="openAddServer()" class="btn btn-secondary btn-xs">
                    <i class="ph ph-plus text-xs"></i> Add
                  </button>
                </div>
                <div class="max-h-[50vh] overflow-y-auto">
                  <!-- Agent binding hint: all servers stay visible; blocked ones are disabled -->
                  <template x-if="agentMcpRestricted">
                    <div class="px-3 py-1.5 bg-[var(--bg-tertiary)] border-b border-[var(--border-primary)] text-[11px] text-[var(--text-secondary)]">
                      Bound to <span class="font-medium" x-text="selectedAgentName"></span> — all servers visible;
                      <span class="font-medium" x-text="agentAllowedServerNames.length"></span> allowed, others can be enabled for this session.
                    </div>
                  </template>
                  <!-- List view: servers → tools -->
                  <template x-if="mcpView === 'list'">
                    <div>
                      <template x-for="server in mcpServers" :key="server.name">
                        <div class="px-3 py-2.5 border-b border-[var(--border-primary)] last:border-b-0" :class="isMcpBlocked(server) ? 'opacity-50' : ''">
                          <div class="flex items-center gap-2">
                            <span class="badge-dot flex-shrink-0" :class="server.is_connected ? 'badge-dot-green' : 'badge-dot-red'"></span>
                            <span class="font-medium text-sm flex-1 min-w-0 truncate" x-text="server.name"></span>
                            <template x-if="isMcpOverridden(server)">
                              <span class="badge badge-primary text-[10px]">session</span>
                            </template>
                            <template x-if="isMcpBlocked(server)">
                              <span class="badge badge-warning text-[10px]">blocked</span>
                            </template>
                            <template x-if="isMcpOverridden(server)">
                              <button type="button" class="btn btn-primary btn-xs" @click="toggleSessionOverride(server)" title="Revoke session override">
                                Session on
                              </button>
                            </template>
                            <template x-if="!isMcpOverridden(server) && isMcpBlocked(server)">
                              <button type="button" class="btn btn-secondary btn-xs" @click="toggleSessionOverride(server)" title="Enable for this session only (agent still restricts it by default)">
                                Enable
                              </button>
                            </template>
                            <template x-if="!isMcpOverridden(server) && !isMcpBlocked(server)">
                              <button
                                type="button"
                                class="toggle"
                                :class="server.enabled ? 'toggle-on' : ''"
                                @click="toggleServerEnabled(server, !server.enabled)"
                                :title="server.enabled ? 'Disable server' : 'Enable server'"
                              ></button>
                            </template>
                          </div>
                          <div class="text-xs text-[var(--text-tertiary)] mt-0.5" x-text="server.transport_type + (server.error ? ' — ' + server.error : '')"></div>
                          <div class="flex gap-0.5 mt-1.5">
                            <button type="button" @click="reconnectServer(server.name)" class="btn btn-ghost btn-xs" title="Reconnect">
                              <i class="ph ph-arrows-clockwise text-xs"></i>
                            </button>
                            <button type="button" @click="refreshServerTools(server.name)" class="btn btn-ghost btn-xs" title="Refresh tools">
                              <i class="ph ph-arrows-circle-right text-xs"></i>
                            </button>
                            <button type="button" @click="openEditServer(server)" class="btn btn-ghost btn-xs" title="Edit">
                              <i class="ph ph-pencil-simple text-xs"></i>
                            </button>
                            <button type="button" @click="removeServer(server.name)" class="btn btn-ghost btn-xs text-[var(--error)]" title="Remove">
                              <i class="ph ph-trash text-xs"></i>
                            </button>
                          </div>
                          <template x-if="server.tools.length > 0">
                            <div class="mt-2">
                              <button
                                type="button"
                                @click="server.toolsExpanded = !server.toolsExpanded"
                                class="flex items-center gap-1 text-xs text-[var(--text-tertiary)] hover:text-[var(--text-primary)] transition-colors"
                              >
                                <i class="ph ph-caret-right text-xs transition-transform" :class="server.toolsExpanded ? 'rotate-90' : ''"></i>
                                <span x-text="server.tools.length + ' tool' + (server.tools.length === 1 ? '' : 's')"></span>
                              </button>
                              <div x-show="server.toolsExpanded" x-collapse class="mt-1.5 space-y-0.5">
