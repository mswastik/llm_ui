<!-- Chat Area Component -->

<div class="flex-1 flex flex-col" x-data="chat" x-init="init()">

    <!-- Chat Header -->
    <div class="bg-white border-b border-gray-200 px-6 py-2">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4 flex-1">
                <!-- Agent Selector -->
                <div class="relative">
                    <select
                        x-model="selectedAgentId"
                        @change="updateSelectedAgent()"
                        class="appearance-none bg-blue-50 text-blue-700 border border-blue-200 rounded-lg px-3 py-1.5 pr-8 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-300 cursor-pointer hover:bg-blue-100 transition">
                        <option value="">Default Assistant</option>
                        <template x-for="agent in availableAgents" :key="agent.id">
                            <option :value="agent.id" x-text="agent.name"></option>
                        </template>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                        <svg class="w-3 h-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </div>
                </div>

                <!-- Knowledge Base Selector -->
                <div class="relative" x-show="enableRAG">
                    <select
                        x-model="selectedDocumentIds"
                        class="appearance-none bg-green-50 text-green-700 border border-green-200 rounded-lg px-3 py-1.5 pr-8 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-300 cursor-pointer hover:bg-green-100 transition">
                        <option value="all">All Documents</option>
                        <template x-for="doc in documents" :key="doc.id">
                            <option :value="doc.id" x-text="doc.filename"></option>
                        </template>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                        <svg class="w-3 h-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </div>
                </div>

                <input
                    type="text"
                    :value="currentConversationTitle"
                    @change="updateConversationTitle($store.chat.currentConversationId, $event)"
                    class="text-xl font-semibold text-gray-900 bg-transparent border-none focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-2 py-1 -ml-2 w-full max-w-md"
                    placeholder="Conversation title">
            </div>
            <div class="text-sm text-gray-500">
                <span x-text="messages.length"></span> messages
            </div>
        </div>
    </div>

    <!-- Messages Container -->
    <div class="flex-1 overflow-y-auto p-6 space-y-4" x-ref="messagesContainer" id="messages-container">
        <template x-for="message in messages" :key="message.id">
            <div :class="message.role === 'user' ? 'flex justify-end' : 'flex justify-start'" class="group">
                <div :class="message.role === 'user' ? 'bg-blue-100 text-black' : 'bg-white border border-gray-200 text-gray-900'"
                     class="max-w-6xl w-full rounded-lg p-4 shadow-sm relative">

                    <!-- Message Actions -->
                    <div class="absolute bottom-1 right-1 opacity-0 group-hover:opacity-100 transition flex gap-1">
                        <button @click="copyMessage(message)" class="p-1 rounded hover:bg-gray-100 text-gray-500"
                            :class="message.role === 'user' ? 'hover:text-blue-800' : 'hover:text-green-600'" title="Copy">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </button>
                        <template x-if="message.role === 'assistant'">
                            <button @click="regenerateResponse(message.id)" :disabled="isLoading"
                                class="p-1 rounded hover:bg-gray-100 text-gray-500 hover:text-blue-600 disabled:opacity-50" title="Regenerate">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                            </button>
                        </template>
                        <button x-show="message.role === 'assistant'" @click="speakMessage(message)" type="button"
                            class="p-1 rounded hover:bg-gray-100 text-gray-500 hover:text-purple-600 disabled:opacity-50"
                            :class="$store.tts.loading[message.id] ? 'opacity-50' : ''" 
                            :disabled="$store.tts.loading[message.id] || !$store.tts.available"
                            :title="!$store.tts.available ? 'TTS unavailable' : ($store.tts.currentAudioMessageId === message.id && $store.tts.isPlaying ? 'Pause' : 'Read aloud')">
                            <svg class="w-4 h-4" :class="$store.tts.loading[message.id] ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" x-show="!($store.tts.currentAudioMessageId === message.id && $store.tts.isPlaying)"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6" x-show="$store.tts.currentAudioMessageId === message.id && $store.tts.isPlaying"></path>
                            </svg>
                        </button>
                        <button x-show="message.role === 'assistant' && $store.tts.currentAudio && $store.tts.currentAudioMessageId === message.id"
                            @click="stopAudio()" type="button" class="p-1 rounded hover:bg-gray-100 text-red-500 hover:text-red-700" title="Stop">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                            </svg>
                        </button>
                        <button @click="startEditMessage(message.id, message.content)"
                            class="p-1 rounded hover:bg-gray-100 text-gray-500" :class="message.role === 'user' ? 'hover:text-blue-800' : 'hover:text-blue-400'" title="Edit">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                        </button>
                        <button @click="deleteMessage(message.id, $event)"
                            class="p-1 rounded hover:bg-gray-100 text-gray-500" :class="message.role === 'user' ? 'hover:text-red-700' : 'hover:text-red-600'" title="Delete">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Edit Mode -->
                    <template x-if="editingMessageId === message.id">
                        <div class="mt-2">
                            <textarea x-model="editContent" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900"></textarea>
                            <div class="flex gap-2 mt-2">
                                <button @click="saveEdit(message.id)" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">Save</button>
                                <button @click="cancelEdit()" class="px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 text-sm">Cancel</button>
                            </div>
                        </div>
                    </template>

                    <!-- Model Name -->
                    <template x-if="message.role === 'assistant' && message.metadata && message.metadata.model">
                        <div class="text-md text-amber-800 mb-2 font-bold"><span x-text="message.metadata.model"></span></div>
                    </template>

                    <!-- Tool Calls / Thinking / Content Blocks -->
                    <template x-if="shouldShowToolCalls(message)">
                        <div class="space-y-3">
                            <!-- Render all blocks in order using template wrapper -->
                            <template x-for="(block, index) in message.tool_calls" :key="'block-' + message.id + '-' + index">
                                <div>
                                    <div x-show="block.type === 'thinking'" class="border-l-4 border-purple-500 bg-purple-50 rounded-r-lg">
                                        <div @click="toggleThinkingBlock(message.id, index)" class="flex items-center gap-2 cursor-pointer select-none px-3 py-2 hover:bg-purple-100 transition rounded-r-lg">
                                            <svg class="w-3 h-3 transition-transform duration-200" :class="isThinkingBlockExpanded(message.id, index) ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                            </svg>
                                            <svg class="w-4 h-4 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                                            </svg>
                                            <span class="font-semibold text-purple-700 text-sm">Thinking</span>
                                            <span class="text-purple-400 text-xs" x-text="'(' + (block.content?.length || 0) + ' chars)'"></span>
                                        </div>
                                        <div x-show="isThinkingBlockExpanded(message.id, index)" x-collapse class="px-3 pb-3">
                                            <div class="text-sm text-gray-800 prose prose-sm max-w-none" x-html="renderMarkdown(block.content || '')"></div>
                                        </div>
                                    </div>
                                    <div x-show="block.type === 'tool_call'" class="mb-2 py-1 rounded-md text-sm min-w-16 hover:bg-amber-100 border border-amber-200">
                                        <div @click="toggleToolCallBlock(message.id, index)" class="flex items-center gap-2 cursor-pointer select-none text-xs font-medium text-amber-700 hover:text-amber-900 transition px-2 py-1">
                                            <svg class="w-3 h-3 transition-transform duration-200" :class="isToolCallBlockExpanded(message.id, index) ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                            </svg>
                                            <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                            </svg>
                                            <span class="font-semibold" x-text="block.name || 'Tool'"></span>
                                            <template x-if="block.status === 'completed'"><span class="text-green-600 text-xs">✓</span></template>
                                            <template x-if="block.status === 'error'"><span class="text-red-600 text-xs">✗</span></template>
                                        </div>
                                        <div x-show="isToolCallBlockExpanded(message.id, index)" x-collapse class="mt-2 px-2">
                                            <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs space-y-3">
                                                <!-- Search Steps Display for search_web tool -->
                                                <template x-if="block.name === 'search_web' && block.search_steps && block.search_steps.length > 0">
                                                    <div class="space-y-2">
                                                        <div class="font-semibold text-amber-800 border-b border-amber-200 pb-1">🔍 Search Steps</div>
                                                        <template x-for="(step, idx) in block.search_steps" :key="idx">
                                                            <div class="bg-white border border-amber-100 rounded p-2">
                                                                <div class="flex items-center gap-2 mb-1">
                                                                    <span class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded text-xs font-medium" x-text="'Step ' + (idx + 1)"></span>
                                                                    <span class="text-gray-600" x-text="step.query"></span>
                                                                </div>
                                                                <div class="flex gap-3 text-gray-500">
                                                                    <span x-text="'📄 ' + step.sources_found + ' sources'"></span>
                                                                    <span x-text="'📝 ' + step.chunks_created + ' chunks'"></span>
                                                                </div>
                                                                <!-- Search Terms for this step -->
                                                                <template x-if="step.search_terms && step.search_terms.length > 0">
                                                                    <div class="mt-2 pt-2 border-t border-amber-100">
                                                                        <div class="font-semibold text-blue-800 mb-1">📌 Extracted Search Terms</div>
                                                                        <div class="flex flex-wrap gap-1">
                                                                            <template x-for="(term, termIdx) in step.search_terms" :key="termIdx">
                                                                                <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs" x-text="term"></span>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                </template>
                                                                <!-- Reasoning/Analysis for this step -->
                                                                <template x-if="step.reasoning">
                                                                    <div class="mt-2 pt-2 border-t border-purple-100">
                                                                        <div class="font-semibold text-purple-800 mb-1">🧠 Analysis</div>
                                                                        <div class="text-gray-700 text-xs" x-text="step.reasoning"></div>
                                                                        <template x-if="step.coverage_score">
                                                                            <div class="mt-1 text-xs">
                                                                                <span class="text-gray-500">Coverage Score: </span>
                                                                                <span :class="step.coverage_score >= 0.8 ? 'text-green-600' : 'text-amber-600'" x-text="(step.coverage_score * 100).toFixed(0) + '%'"></span>
                                                                            </div>
                                                                        </template>
                                                                        <template x-if="step.follow_up_queries">
                                                                            <div class="mt-1 text-xs text-amber-700">
                                                                                <span class="font-medium">→ Continuing search with:</span>
                                                                                <span x-text="step.follow_up_queries.join(', ')"></span>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>

                                                <!-- Search Terms Display (legacy - shows all terms if step-specific terms not available) -->
                                                <template x-if="block.search_terms && block.search_terms.length > 0 && (!block.search_steps || block.search_steps.length === 0)">
                                                    <div class="bg-blue-50 border border-blue-200 rounded p-2">
                                                        <div class="font-semibold text-blue-800 mb-1">📌 Extracted Search Terms</div>
                                                        <div class="flex flex-wrap gap-1">
                                                            <template x-for="(term, idx) in block.search_terms" :key="idx">
                                                                <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs" x-text="term"></span>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                                
                                                <!-- Args Display -->
                                                <template x-if="block.arguments && Object.keys(block.arguments).length > 0">
                                                    <div class="mb-2">
                                                        <div class="text-xs text-gray-500 mb-1">Args:</div>
                                                        <div class="bg-gray-100 rounded p-2 font-mono text-gray-50 overflow-x-auto">
                                                            <pre x-text="typeof block.arguments === 'object' ? JSON.stringify(block.arguments, null, 2) : block.arguments"></pre>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Message Content -->
                    <template x-if="editingMessageId !== message.id">
                        <div>
                            <div class="prose prose-sm max-w-none" x-html="renderMarkdownWithCitations(message.content, getMessageSources(message))"></div>
                            <template x-if="message.role === 'assistant' && getMessageSources(message).length > 0">
                                <div class="mt-4 pt-3 border-t border-gray-200">
                                    <div @click="toggleSources(message.id)" class="flex items-center gap-2 cursor-pointer select-none text-xs font-medium text-gray-500 hover:text-gray-700 transition">
                                        <svg class="w-3 h-3 transition-transform duration-200" :class="isSourcesExpanded(message.id) ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                        </svg>
                                        <span>Sources (<span x-text="getMessageSources(message).length"></span>)</span>
                                    </div>
                                    <div x-show="isSourcesExpanded(message.id)" x-collapse class="mt-2">
                                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-2 max-h-64 overflow-y-auto">
                                            <ol class="list-decimal list-inside space-y-1 text-xs">
                                                <template x-for="(source, index) in getMessageSources(message)" :key="index">
                                                    <li class="flex items-start gap-1 py-0.5">
                                                        <span class="text-gray-500 font-mono" x-text="(index + 1) + '.'"></span>
                                                        <a :href="source.url" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 hover:underline break-all" x-text="source.title || source.url"></a>
                                                    </li>
                                                </template>
                                            </ol>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Tool Status -->
        <template x-if="toolStatus.active">
            <div class="flex justify-start">
                <div class="bg-amber-50 border border-amber-200 rounded-lg p-2 max-w-4xl">
                    <div class="flex items-center gap-2">
                        <div class="animate-spin"><svg class="w-5 h-5 text-amber-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></div>
                        <div class="flex-1">
                            <div class="font-medium text-sm text-amber-900" x-text="toolStatus.tool"></div>
                            <div class="text-sm text-amber-700" x-text="toolStatus.status"></div>
                            <template x-if="toolStatus.progress !== null">
                                <div class="mt-2"><div class="bg-amber-200 rounded-full h-2 overflow-hidden"><div class="bg-amber-600 h-full transition-all duration-300" :style="`width: ${toolStatus.progress}%`"></div></div></div>
                            </template>
                        </div>
                        <button @click="cancelRequest()" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            Stop
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Loading -->
        <template x-if="isLoading && !toolStatus.active">
            <div class="flex justify-start">
                <div class="bg-white border border-gray-200 rounded-lg p-4">
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        </div>
                        <button @click="cancelRequest()" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            Stop
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Input Area -->
    <div class="pt-1 pl-2">
        <form @submit.prevent="sendMessage(inputMessage)" class="flex gap-3">
            <textarea
                x-model="inputMessage"
                @keydown.enter.prevent="if (!$event.shiftKey) sendMessage(inputMessage)"
                placeholder="Type your message... (Shift+Enter for new line)"
                rows="2"
                class="flex-1 px-4 py-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 resize-none"
                style="max-height: 400px;"
                :disabled="isLoading"></textarea>

            <!-- Send/Stop Button -->
            <template x-if="!isLoading">
                <button
                    type="submit"
                    :disabled="!inputMessage.trim()"
                    class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                    title="Send message">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </template>
            <template x-if="isLoading">
                <button
                    type="button"
                    @click="cancelRequest()"
                    class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
                    title="Stop generating">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                    </svg>
                </button>
            </template>
        </form>

        <!-- Tool Toggles and Model Selector -->
        <div class="flex gap-2 m-1 items-center flex-wrap">
            <!-- Model Selector -->
            <div class="relative">
                <select
                    x-model="selectedModel"
                    @change="updateSelectedModel()"
                    class="appearance-none bg-gray-50 text-gray-700 border border-gray-200 rounded-lg px-3 py-1 pr-8 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-300 cursor-pointer">
                    <option value="" disabled>Select Model</option>
                    <template x-for="model in availableModels" :key="model.id">
                        <option :value="model.id" x-text="model.name || model.id"></option>
                    </template>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
            </div>

            <div class="h-6 w-px bg-gray-300"></div>

            <!-- Web Search Toggle -->
            <button
                @click="enableWebSearch = !enableWebSearch"
                :class="enableWebSearch ? 'bg-blue-100 text-blue-700 border-blue-300' : 'bg-gray-50 text-gray-600 border-gray-200'"
                class="px-3 py-1 rounded-lg border text-sm font-medium transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                Web Search
            </button>

            <!-- RAG Toggle -->
            <button
                @click="enableRAG = !enableRAG"
                :class="enableRAG ? 'bg-green-100 text-green-700 border-green-300' : 'bg-gray-50 text-gray-600 border-gray-200'"
                class="px-3 py-1 rounded-lg border text-sm font-medium transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                Search Documents
                <span x-show="$store.documents.list?.length > 0" class="bg-green-200 text-green-800 text-xs px-1.5 rounded-full" x-text="$store.documents.list?.length || 0"></span>
            </button>
        </div>

        <!-- Status Indicators -->
        <div class="mt-2 flex gap-2 text-xs text-gray-500">
            <span x-show="selectedModel" class="flex items-center gap-1">
                <span class="w-2 h-2 bg-purple-400 rounded-full"></span>
                Model: <span x-text="selectedModel" class="font-medium"></span>
            </span>
            <span x-show="enableWebSearch" class="flex items-center gap-1">
                <span class="w-2 h-2 bg-blue-400 rounded-full"></span>
                Web search enabled
            </span>
            <span x-show="enableRAG" class="flex items-center gap-1">
                <span class="w-2 h-2 bg-green-400 rounded-full"></span>
                Document search enabled
            </span>
        </div>
    </div>
</div>
