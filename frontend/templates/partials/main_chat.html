                                <template x-for="tool in server.tools" :key="tool.name">
                                  <label class="flex items-center gap-2 px-1 py-0.5 rounded cursor-pointer hover:bg-[var(--bg-tertiary)] text-xs" :title="tool.description || ''">
                                    <input type="checkbox" :checked="!server.disabled_tools.includes(tool.name)" @change="toggleToolEnabled(server, tool.name, !$event.target.checked)" class="rounded" style="accent-color: var(--accent-primary)" />
                                    <span class="truncate" x-text="tool.name"></span>
                                  </label>
                                </template>
                              </div>
                            </div>
                          </template>
                        </div>
                      </template>
                      <div x-show="mcpServers.length === 0" class="px-3 py-6 text-center text-xs text-[var(--text-tertiary)]">
                        No MCP servers configured.
                        <button type="button" @click="openAddServer()" class="text-[var(--text-link)] hover:underline">Add one</button>
                      </div>
                    </div>
                  </template>

                  <!-- Form view: add / edit server -->
                  <template x-if="mcpView === 'form'">
                    <div class="p-3 space-y-2">
                      <div>
                        <label class="text-xs text-[var(--text-tertiary)]">Name</label>
                        <input x-model="mcpForm.name" type="text" class="input text-sm" placeholder="server-name" />
                      </div>
                      <div>
                        <label class="text-xs text-[var(--text-tertiary)]">Transport</label>
                        <select x-model="mcpForm.transport_type" class="select text-sm w-full">
                          <option value="stdio">stdio</option>
                          <option value="sse">SSE</option>
                          <option value="streamable-http">Streamable HTTP</option>
                        </select>
                      </div>
                      <template x-if="mcpForm.transport_type === 'stdio'">
                        <div class="space-y-2">
                          <div>
                            <label class="text-xs text-[var(--text-tertiary)]">Command</label>
                            <input x-model="mcpForm.command" type="text" class="input text-sm" placeholder="npx" />
                          </div>
                          <div>
                            <label class="text-xs text-[var(--text-tertiary)]">Args (JSON array)</label>
                            <input x-model="mcpForm.args" type="text" class="input text-sm" placeholder='["-y", "@modelcontextprotocol/server-filesystem"]' />
                          </div>
                        </div>
                      </template>
                      <div>
                        <label class="text-xs text-[var(--text-tertiary)]">Env (JSON object)</label>
                        <input x-model="mcpForm.env" type="text" class="input text-sm" placeholder='{"KEY": "value"}' />
                      </div>
                      <template x-if="mcpForm.transport_type !== 'stdio'">
                        <div>
                          <label class="text-xs text-[var(--text-tertiary)]">URL</label>
                          <input x-model="mcpForm.url" type="text" class="input text-sm" placeholder="https://..." />
                        </div>
                      </template>
                      <template x-if="mcpForm.transport_type !== 'stdio'">
                        <div>
                          <label class="text-xs text-[var(--text-tertiary)]">Headers (JSON object, e.g. Authorization)</label>
                          <input x-model="mcpForm.headers" type="text" class="input text-sm" placeholder='{"Authorization": "Bearer token"}' />
                        </div>
                      </template>
                      <div>
                        <label class="text-xs text-[var(--text-tertiary)]">Timeout (s)</label>
                        <input x-model.number="mcpForm.timeout" type="number" class="input text-sm" />
                      </div>
                      <div class="flex gap-2 pt-1">
                        <button type="button" @click="saveMCPServer()" class="btn btn-primary btn-sm flex-1">Save</button>
                        <button type="button" @click="cancelMCPForm()" class="btn btn-secondary btn-sm">Cancel</button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-1 flex-shrink-0">
            <!-- Attach button -->
            <button
              type="button"
              @click="triggerFileUpload()"
              :disabled="isLoading || isUploading"
              class="btn btn-icon btn-ghost h-[32px] w-[32px] p-0"
              title="Attach files"
            >
              <i class="ph ph-paperclip text-base"></i>
            </button>

            <!-- Mic button -->
            <button
              type="button"
              @click="toggleRecording()"
              :disabled="isLoading || !sttSupported"
              class="btn btn-icon btn-ghost h-[32px] w-[32px] p-0"
              :class="isRecording ? '!text-[var(--error)] !bg-red-500/10 animate-pulse' : ''"
              x-show="sttSupported"
              :title="isRecording ? 'Stop recording' : 'Voice input'"
            >
              <i
                class="ph text-base"
                :class="isRecording ? 'ph-microphone-slash' : 'ph-microphone'"
              ></i>
            </button>

            <button
              type="submit"
              :disabled="(!inputMessage.trim() && attachedFiles.length === 0) || (isLoading && !$store.chat.activeStreaming.isStreaming) || isUploading"
              class="btn btn-primary h-[32px] w-[32px] p-0"
              :title="isLoading && $store.chat.activeStreaming.isStreaming ? 'Send — interrupts the current response' : 'Send'"
            >
              <i class="ph ph-paper-plane-right text-base"></i>
            </button>
          </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Source Content Modal -->
  <div
    x-show="showSourceModal"
    x-cloak
    @click.self="closeSourceModal()"
    @keydown.escape.window="closeSourceModal()"
    class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
  >
    <div class="bg-[var(--bg-secondary)] border border-[var(--border-primary)] rounded-lg shadow-xl max-w-2xl w-full max-h-[80vh] overflow-hidden flex flex-col">
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-[var(--border-primary)] flex items-center justify-between flex-shrink-0">
        <h3 class="font-semibold flex items-center gap-2">
          <i class="ph ph-file-text text-[var(--accent-primary)]"></i>
          <span x-text="selectedSource?.title || 'Source Content'"></span>
        </h3>
        <button @click="closeSourceModal()" class="btn btn-icon btn-ghost">
          <i class="ph ph-x text-lg"></i>
        </button>
      </div>

      <!-- Modal Content -->
      <div class="flex-1 overflow-y-auto px-6 py-4">
        <div class="prose prose-sm max-w-none text-sm text-[var(--text-primary)]">
          <p x-html="selectedSource?.chunk_content?.replace(/\n/g, '<br>') || ''"></p>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-3 border-t border-[var(--border-primary)] flex justify-between items-center bg-[var(--bg-tertiary)] flex-shrink-0">
        <div class="text-xs text-[var(--text-tertiary)]">
          <span x-text="'Document ID: ' + (selectedSource?.title?.split(' - ')[0] || 'Unknown')"></span>
        </div>
        <button @click="closeSourceModal()" class="btn btn-primary btn-sm">
          Close
        </button>
      </div>
    </div>
  </div>
</main>
