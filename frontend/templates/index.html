{% extends "base.html" %}

{% block body_attrs %}{% endblock %}

{% block content %}
<!-- Main Container -->
<div class="flex h-screen">
    <!-- Sidebar -->
    {% include "partials/sidebar.html" %}

    <!-- Main Chat Area -->
    {% include "partials/chat.html" %}
</div>

<!-- Toast Notification -->
<div x-show="$store.chat.toast.show"
     x-transition
     class="fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50"
     :class="{
         'bg-green-500 text-white': $store.chat.toast.type === 'success',
         'bg-red-500 text-white': $store.chat.toast.type === 'error',
         'bg-blue-500 text-white': $store.chat.toast.type === 'info'
     }"
     x-text="$store.chat.toast.message">
</div>

<!-- Modals are included in their respective partials with x-data -->
{% include "partials/settings.html" %}
{% include "partials/documents.html" %}
{% endblock %}
