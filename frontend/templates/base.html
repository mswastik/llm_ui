<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LLM UI">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <title>{% block title %}LLM UI{% endblock %}</title>

    <!-- Tailwind CSS (utility classes for rare cases) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Phosphor Icons (clean, consistent icon library) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- PDF.js 3.11 (UMD build — classic worker, no module/private-field realm issues) -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <!-- PDF.js viewer classes (PDFViewer, PDFLinkService, EventBus, outline, etc.) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.css">
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.js"></script>

    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="/static/css/theme.css?v=47">
    <!-- Alpine.js stores data (plain objects, no Alpine dependency) -->
    <script>
      // ═══════════════════════════════════════════════════════════
      // Store data must be available BEFORE main.js imports Alpine.
      // This inline script runs synchronously during HTML parse.
      // ═══════════════════════════════════════════════════════════
    window.__chatStoreData__ = {
        conversations: [], currentConversationId: null, currentConversationTitle: 'New Chat',
        messages: [], inputMessage: '', isLoading: false,
        activeStreaming: { isStreaming: false, requestId: null, conversationId: null, msgIndex: null, conversationTitle: '', messages: [] },
        toolStatus: { active: false, tool: '', status: '', progress: null },
        selectedModel: '', availableModels: [], selectedAgentId: null, availableAgents: [], currentAgentConfig: null,
        selectedProviderId: '', availableProviders: [],
        selectedDocumentIds: [], editingMessageId: null, editContent: '',
        thinkingMode: localStorage.getItem('thinkingMode') || 'auto',
        addConversation(c) { this.conversations.unshift(c) },
        updateConversation(id, u) { const i = this.conversations.findIndex(x => x.id === id); if (i !== -1) Object.assign(this.conversations[i], u) },
        removeConversation(id) { this.conversations = this.conversations.filter(x => x.id !== id) },
        addMessage(m) { this.messages.push(m) },
        updateMessage(id, u) { const m = this.messages.find(x => x.id === id); if (m) Object.assign(m, u) },
        removeMessage(id) { this.messages = this.messages.filter(m => m.id !== id) },
        clearMessages() { this.messages = [] },
        setModel(v) { this.selectedModel = v; const m = this.availableModels.find(x=>x.id===v); this.selectedProviderId = m?.provider_id || this.selectedProviderId || this.availableProviders[0]?.id || ''; localStorage.setItem('selectedModel', v); localStorage.setItem('userModel', v); localStorage.setItem('selectedProviderId', this.selectedProviderId || '') },
        loadSavedModel() { const s = localStorage.getItem('selectedModel'); if (s) { const m = this.availableModels.find(x=>x.id===s); if (m) { this.selectedModel = s; this.selectedProviderId = m.provider_id; } else if (this.availableModels.some(m=>m.id===s)) { this.selectedModel = s; } else { this.selectedModel = s; } } if (!this.selectedProviderId) { const cur = this.availableModels.find(x=>x.id===this.selectedModel); this.selectedProviderId = cur?.provider_id || localStorage.getItem('selectedProviderId') || this.availableProviders[0]?.id || ''; } },
        setAgent(v) { this.selectedAgentId = v; this.currentAgentConfig = this.availableAgents.find(a => a.id === v) || null; localStorage.setItem('selectedAgentId', v) },
        loadSavedAgent() { const s = localStorage.getItem('selectedAgentId'); if (s && this.availableAgents.some(a => a.id === parseInt(s))) { this.selectedAgentId = parseInt(s); this.currentAgentConfig = this.availableAgents.find(a => a.id === this.selectedAgentId) } },
        setThinkingMode(v) { this.thinkingMode = v || 'auto'; localStorage.setItem('thinkingMode', this.thinkingMode) },
        loadSavedThinkingMode() { const s = localStorage.getItem('thinkingMode'); if (s && ['auto','off','on','low','medium','high'].includes(s)) this.thinkingMode = s },
        startStreaming(rq, cid, mi, t, ms) { this.activeStreaming = { isStreaming: true, requestId: rq, conversationId: cid, msgIndex: mi, conversationTitle: t || '', messages: ms || [] }; this.isLoading = true },
        stopStreaming() { this.activeStreaming = { isStreaming: false, requestId: null, conversationId: null, msgIndex: null, conversationTitle: '', messages: [] }; this.isLoading = false; this.toolStatus = { active: false, tool: '', status: '', progress: null } },
        applyAgentConfig(force=false) { const a = this.currentAgentConfig; const known = (id) => !!id && this.availableModels.some(m => m.id === id); const apply = (id) => { this.selectedModel = id; const m = this.availableModels.find(x => x.id === id); this.selectedProviderId = (m && m.provider_id) || (a && a.provider_id) || localStorage.getItem('selectedProviderId') || (this.availableProviders[0] && this.availableProviders[0].id) || ''; }; if (!a) { const u = localStorage.getItem('userModel'); if (known(u)) apply(u); else if (!known(this.selectedModel)) apply((this.availableModels[0] || {}).id || ''); this.selectedDocumentIds = []; return; } if (known(a.model)) apply(a.model); else { const u = localStorage.getItem('userModel'); apply(known(u) ? u : ((this.availableModels[0] || {}).id || this.selectedModel || '')); } this.selectedDocumentIds = a.enable_rag ? (this.selectedDocumentIds.length ? this.selectedDocumentIds : ['all']) : [] }
      };
      window.__uiStoreData__ = {
        darkMode: localStorage.getItem('darkMode') === 'true',
        sidebarCollapsed: false,
        sidebarWidth: parseInt(localStorage.getItem('sidebarWidth') || '280'),
        sidebarMobileOpen: false,
        showMcpPanel: false, showSettings: false, showDocuments: false, showJobs: false,
        toast: { show: false, message: '', type: 'success' },
        isPaused: false,
        settingsData: {}, mcpServers: [], mcpTools: [],
        // Books / reader state — see /api/books
        showLibrary: false, books: [],
        // Main-pane view: 'chat' | 'library'. The library is a full-pane
        // view (not a modal) so hundreds of web saves stay browsable.
        mainView: 'chat',
        setMainView(v) { this.mainView = (v === 'library') ? 'library' : 'chat' },
        newServer: { name: '', transport_type: 'stdio', command: '', args: '[]', url: '', env: '{}', headers: '{}', timeout: 60 },
        editingServer: false,
        editServer: { name: '', transport_type: 'stdio', command: '', args: '[]', url: '', env: '{}', headers: '{}', enabled: true, originalName: '', timeout: 60 },
        settingsTab: 'general',
        showNotes: false, notes: [], documents: [], activeAgentFilters: [], activeTagFilter: null, editingTagsForConversation: null, tagInput: '',
        toggleDarkMode() { this.darkMode = !this.darkMode; localStorage.setItem('darkMode', this.darkMode); document.documentElement.setAttribute('data-theme', this.darkMode ? 'dark' : 'light') },
        initTheme() { document.documentElement.setAttribute('data-theme', this.darkMode ? 'dark' : 'light') },
        toggleSidebar() { this.sidebarCollapsed = !this.sidebarCollapsed; this.sidebarWidth = this.sidebarCollapsed ? 68 : 280; localStorage.setItem('sidebarWidth', this.sidebarWidth) },
        setSidebarWidth(w) { this.sidebarWidth = w; localStorage.setItem('sidebarWidth', w) },
        openSidebarMobile() { this.sidebarMobileOpen = true },
        closeSidebarMobile() { this.sidebarMobileOpen = false },
        showToast(msg, type) { this.toast = { show: true, message: msg || '', type: type || 'success' }; setTimeout(() => { this.toast = { show: false, message: '', type: 'success' } }, 3000) },
        openMcpPanel() { this.showMcpPanel = true },
        closeMcpPanel() { this.showMcpPanel = false },
        openSettings() { this.showSettings = true },
        closeSettings() { this.showSettings = false },
        openDocuments() { this.showDocuments = true },
        closeDocuments() { this.showDocuments = false },
        openNotes() { this.showNotes = true },
        closeNotes() { this.showNotes = false },
        openJobs() { this.showJobs = true },
        closeJobs() { this.showJobs = false },
        openLibrary() { this.showLibrary = true },
        closeLibrary() { this.showLibrary = false },
        openLibraryView() { this.mainView = 'library' },
        openChatView() { this.mainView = 'chat' },
        toggleAgentFilter(v) { const i = this.activeAgentFilters.indexOf(v); if (i >= 0) { this.activeAgentFilters.splice(i, 1) } else { this.activeAgentFilters.push(v) }; this.activeTagFilter = null },
        clearFilters() { this.activeAgentFilters = []; this.activeTagFilter = null },
        startEditTags(id) { this.editingTagsForConversation = id; this.tagInput = '' },
        stopEditTags() { this.editingTagsForConversation = null; this.tagInput = '' }
      };
    </script>

    <!-- App Init — imports Alpine ESM, registers everything, calls Alpine.start() -->
    <script type="module" src="/static/js/main.js?v=102"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[var(--bg-primary)] text-[var(--text-primary)] h-screen overflow-hidden"
      {% block body_attrs %}{% endblock %}>
    {% block content %}{% endblock %}

    <!-- Toast Container -->
    <div x-cloak x-show="$store.ui.toast.show"
         x-transition
         x-text="$store.ui.toast.message"
         class="fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-xl z-[200] text-sm font-medium
                animate-slide-up"
         :class="{
             'toast-success': $store.ui.toast.type === 'success',
             'toast-error': $store.ui.toast.type === 'error',
             'toast-info': $store.ui.toast.type === 'info',
             'toast-warning': $store.ui.toast.type === 'warning'
         }">
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
