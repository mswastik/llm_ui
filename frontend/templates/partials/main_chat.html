<!-- ═══════════ MAIN CHAT AREA ═══════════ -->
  <main
    class="flex-1 flex flex-col min-w-0 bg-[var(--bg-primary)]"
    x-data="chat"
    x-init="init()"
  >
    <!-- Chat Header -->
    <header
      class="h-[var(--header-height)] border-b border-[var(--border-primary)] px-4 flex items-center justify-between flex-shrink-0 bg-[var(--bg-glass)] backdrop-blur-sm"
    >
      <div class="flex items-center gap-2 flex-1 min-w-0">
        <!-- Agent Selector -->
        <select
          x-model="selectedAgentId"
          @change="updateSelectedAgent()"
          class="select text-xs max-w-[150px]"
        >
          <option value="">Default Agent</option>
          <template x-for="agent in availableAgents" :key="agent.id">
            <option :value="agent.id" x-text="agent.name"></option>
          </template>
        </select>

        <!-- Model Selector -->
        <select
          x-model="selectedModel"
          @change="updateSelectedModel()"
          class="select text-xs max-w-[180px]"
        >
          <option value="" disabled>Model</option>
          <template x-for="model in availableModels" :key="model.id">
            <option :value="model.id" x-text="model.name || model.id"></option>
          </template>
        </select>

        <!-- Document Selector -->
        <div class="relative" x-data="{ docDropdownOpen: false }" @click.outside="docDropdownOpen = false">
          <button
            @click="docDropdownOpen = !docDropdownOpen"
            class="pill text-xs"
            :class="selectedDocumentIds.length > 0 ? 'pill-active' : 'pill-default'"
          >
            <i class="ph ph-books text-xs"></i>
            <span x-text="selectedDocumentIds.length > 0 ? (selectedDocumentIds.includes('all') ? 'All Docs' : selectedDocumentIds.length + ' docs') : 'Docs'"></span>
          </button>
          <div
            x-show="docDropdownOpen"
            x-cloak
            class="absolute top-full left-0 mt-1 bg-[var(--bg-secondary)] border border-[var(--border-primary)] rounded-lg shadow-xl z-50 min-w-[200px] max-h-[260px] overflow-y-auto py-1"
          >
            <label class="flex items-center gap-2 px-3 py-2 hover:bg-[var(--bg-tertiary)] cursor-pointer text-sm border-b border-[var(--border-primary)]">
              <input type="checkbox" :checked="isDocumentSelected('all')" @change="toggleDocument('all')" class="rounded" style="accent-color: var(--accent-primary)" />
              <span class="font-medium">All documents</span>
            </label>
            <template x-for="doc in documents" :key="doc.id">
              <label class="flex items-center gap-2 px-3 py-2 hover:bg-[var(--bg-tertiary)] cursor-pointer text-sm">
                <input type="checkbox" :checked="isDocumentSelected(doc.id)" @change="toggleDocument(doc.id)" class="rounded" style="accent-color: var(--accent-primary)" />
                <span class="truncate" x-text="doc.filename"></span>
              </label>
            </template>
            <div x-show="documents.length === 0" class="px-3 py-3 text-xs text-[var(--text-tertiary)] text-center">
              No documents uploaded
            </div>
          </div>
        </div>

        <!-- Title -->
        <input
          :value="currentConversationTitle"
          @change="updateTitle($event)"
          class="text-sm font-semibold bg-transparent border-none outline-none text-[var(--text-primary)] placeholder-[var(--text-tertiary)] flex-1 min-w-0"
          placeholder="Conversation title"
        />
      </div>

      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- Message count -->
        <span
          class="text-xs text-[var(--text-tertiary)]"
          x-text="messages.length + ' messages'"
        ></span>
        <!-- Dark mode toggle -->
        <button
          @click="$store.ui.toggleDarkMode()"
          class="btn btn-icon btn-ghost"
          title="Toggle theme"
        >
          <i class="ph ph-moon text-lg" x-show="!$store.ui.darkMode"></i>
          <i class="ph ph-sun text-lg" x-show="$store.ui.darkMode"></i>
        </button>
      </div>
    </header>

    <!-- Messages Container -->
    <div
      id="messages-container"
      class="flex-1 overflow-y-auto px-4 py-6 space-y-4"
    >
      <!-- Empty State -->
      <div x-show="messages.length === 0" class="empty-state">
        <div class="empty-state-icon">
          <i class="ph ph-robot text-3xl text-[var(--accent-primary)]"></i>
        </div>
        <h2 class="text-xl font-semibold mb-1">Welcome to LLM UI</h2>
        <p class="text-sm max-w-md mb-6">
          Start a conversation by typing a message below. You can use agents,
          search your knowledge base, and connect MCP servers for extended
          capabilities.
        </p>
        <div class="flex flex-wrap gap-2 justify-center">
          <button
            @click="inputMessage = 'What can you help me with?'"
            class="pill pill-default"
          >
            💡 What can you help me with?
          </button>
          <button
            @click="inputMessage = 'Explain how LLMs work'"
            class="pill pill-default"
          >
            🧠 Explain how LLMs work
          </button>
          <button
            @click="inputMessage = 'Help me write code'"
            class="pill pill-default"
          >
            💻 Help me write code
          </button>
        </div>
      </div>

      <!-- Messages -->
      <template x-for="(message, msgIndex) in messages" :key="message.id">
        <div
          class="message-enter"
          :class="message.role === 'user' ? 'flex justify-end' : 'flex justify-start'"
        >
          <div
            class="max-w-[85%] md:max-w-[75%] group relative"
            :class="message.role === 'user' ? 'message-user' : 'message-assistant'"
          >
            <!-- Message Actions -->
            <div
              class="absolute -top-2 right-0 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-10"
            >
              <button
                @click="copyMessage(message)"
                class="btn btn-icon btn-ghost text-xs"
                title="Copy"
                :class="message.role === 'user' ? 'text-white/70 hover:text-white hover:bg-white/20' : 'text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-hover)]'"
              >
                <i class="ph ph-copy text-sm"></i>
              </button>
              <template x-if="message.role === 'assistant'">
                <button
                  @click="regenerate(message.id)"
                  class="btn btn-icon btn-ghost text-xs"
                  title="Regenerate"
                  :disabled="isLoading"
                  :class="message.role === 'user' ? 'text-white/70 hover:text-white hover:bg-white/20' : 'text-[var(--text-tertiary)] hover:text-[var(--accent-primary)] hover:bg-[var(--bg-hover)]'"
                >
                  <i class="ph ph-arrow-clockwise text-sm"></i>
                </button>
              </template>
              <template x-if="message.role === 'assistant'">
                <button
                  @click="speakMessage(message)"
                  class="btn btn-icon btn-ghost text-xs"
                  title="Read aloud"
                  :class="message.role === 'user' ? 'text-white/70 hover:text-white hover:bg-white/20' : 'text-[var(--text-tertiary)] hover:text-[var(--accent-primary)] hover:bg-[var(--bg-hover)]'"
                >
                  <i
                    class="ph ph-speaker-high text-sm"
                    x-show="!($store.ui.isPlaying && $store.ui.currentAudioMessageId === message.id)"
                  ></i>
                  <i
                    class="ph ph-pause text-sm"
                    x-show="$store.ui.isPlaying && $store.ui.currentAudioMessageId === message.id"
                  ></i>
                </button>
              </template>
              <!-- Take Note Button -->
              <template x-if="message.role === 'assistant' && message.content?.trim()">
                <button
                  @click="takeNote(message)"
                  class="btn btn-icon btn-ghost text-xs"
                  title="Take note"
                  :class="message.role === 'user' ? 'text-white/70 hover:text-white hover:bg-white/20' : 'text-[var(--text-tertiary)] hover:text-[var(--accent-primary)] hover:bg-[var(--bg-hover)]'"
                >
                  <i class="ph ph-notebook text-sm"></i>
                </button>
              </template>
              <template
                x-if="$store.ui.isPlaying && $store.ui.currentAudioMessageId === message.id"
              >
                <button
                  @click="stopAudio()"
                  class="btn btn-icon btn-ghost text-xs text-[var(--error)] hover:text-[var(--error)]"
                  title="Stop"
                >
                  <i class="ph ph-stop text-sm"></i>
                </button>
              </template>
              <button
                @click="startEdit(message.id, message.content)"
                class="btn btn-icon btn-ghost text-xs"
                title="Edit"
                :class="message.role === 'user' ? 'text-white/70 hover:text-white hover:bg-white/20' : 'text-[var(--text-tertiary)] hover:text-[var(--accent-primary)] hover:bg-[var(--bg-hover)]'"
              >
                <i class="ph ph-pencil-simple text-sm"></i>
              </button>
              <button
                @click="deleteMessage(message.id, $event)"
                class="btn btn-icon btn-ghost text-xs"
                title="Delete"
                :class="message.role === 'user' ? 'text-white/70 hover:text-white hover:bg-white/20' : 'text-[var(--text-tertiary)] hover:text-[var(--error)] hover:bg-[var(--error-bg)]'"
              >
                <i class="ph ph-trash text-sm"></i>
              </button>
            </div>

            <!-- Edit Mode -->
            <template x-if="editingMessageId === message.id">
              <div class="p-4">
                <textarea
                  x-model="editContent"
                  rows="3"
                  class="input w-full text-sm resize-none"
                  placeholder="Edit your message..."
                ></textarea>
                <div class="flex gap-2 mt-2">
                  <button
                    @click="saveEdit(message.id)"
                    class="btn btn-primary btn-sm"
                  >
                    Save
                  </button>
                  <button
                    @click="cancelEdit()"
                    class="btn btn-secondary btn-sm"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            </template>

            <!-- Message Content -->
            <template x-if="editingMessageId !== message.id">
              <div class="p-4">
                <!-- Model Badge -->
                <template
                  x-if="message.role === 'assistant' && message.metadata?.model"
                >
                  <div class="mb-2">
                    <span
                      class="badge badge-primary"
                      x-text="message.metadata.model"
                    ></span>
                  </div>
                </template>

                <!-- Sequential Blocks -->
                <template x-if="message.blocks?.length > 0">
                  <div class="space-y-2">
                    <template
                      x-for="(block, blockIdx) in message.blocks"
                      :key="'b-' + blockIdx"
                    >
                      <div>
                        <!-- Content Block -->
                        <div x-show="block.type === 'content'" class="prose">
                          <div
                            x-html="renderWithCitations(block.content, extractSources(message.blocks))"
                          ></div>
                        </div>

                        <!-- Thinking Block -->
                        <div
                          x-show="block.type === 'thinking'"
                          class="thinking-block rounded-lg overflow-hidden"
                        >
                          <div
                            @click="toggleBlock('thinking-' + message.id + '-' + blockIdx)"
                            class="thinking-header flex items-center gap-2 px-3 py-1 text-sm"
                          >
                            <i
                              class="ph ph-caret-right text-base transition-transform duration-200"
                              :class="isExpanded('thinking-' + message.id + '-' + blockIdx) ? 'rotate-90' : ''"
                            ></i>
                            <i
                              class="ph ph-brain text-base text-[var(--thinking-text)]"
                            ></i>
                            <span
                              class="font-medium text-sm text-[var(--thinking-text)]"
                              >Thinking</span
                            >
                            <span
                              class="text-xs text-[var(--text-tertiary)]"
                              x-text="(block.content?.length || 0) + ' chars'"
                            ></span>
                          </div>
                          <div
                            x-show="isExpanded('thinking-' + message.id + '-' + blockIdx)"
                            x-collapse
                          >
                            <div
                              class="px-3 pb-3 text-sm prose"
                              x-html="renderMarkdown(block.content || '')"
                            ></div>
                          </div>
                        </div>

                        <!-- Tool Call Block -->
                        <div
                          x-show="block.type === 'tool_call'"
                          class="tool-block overflow-hidden"
                        >
                          <div
                            @click="toggleBlock('tool-' + message.id + '-' + blockIdx)"
                            class="tool-header flex items-center gap-2 px-3 py-1 text-sm"
                          >
                            <i
                              class="ph ph-caret-right text-base transition-transform duration-200"
                              :class="isExpanded('tool-' + message.id + '-' + blockIdx) ? 'rotate-90' : ''"
                            ></i>
                            <i
                              class="ph ph-gear text-base text-[var(--tool-text)]"
                            ></i>
                            <span
                              class="font-medium text-sm text-[var(--tool-text)]"
                              x-text="block.name || 'Tool'"
                            ></span>
                            <template x-if="block.status === 'completed'">
                              <span class="badge badge-success text-xs"
                                >Done</span
                              >
                            </template>
                            <template x-if="block.status === 'error'">
                              <span class="badge badge-error text-xs"
                                >Error</span
                              >
                            </template>
                            <template
                              x-if="block.status === 'starting' || block.status === 'running'"
                            >
                              <span
                                class="badge badge-warning text-xs animate-pulse"
                                >Running</span
                              >
                            </template>
                          </div>
                          <div
                            x-show="isExpanded('tool-' + message.id + '-' + blockIdx)"
                            x-collapse
                          >
                            <div class="px-3 pb-3 space-y-3">
                              <!-- Args -->
                              <template
                                x-if="block.arguments && Object.keys(block.arguments).length > 0"
                              >
                                <div>
                                  <div
                                    class="text-xs text-[var(--text-tertiary)] mb-1"
                                  >
                                    Arguments
                                  </div>
                                  <pre
                                    class="bg-[var(--bg-code)] rounded-md p-2 text-xs text-[var(--text-code)] overflow-x-auto"
                                    x-text="typeof block.arguments === 'object' ? JSON.stringify(block.arguments, null, 2) : block.arguments"
                                  ></pre>
                                </div>
                              </template>

                              <!-- Search Steps (search_web) -->
                              <template
                                x-if="block.name === 'search_web' && block.search_steps?.length > 0"
                              >
                                <div class="space-y-2">
                                  <div
                                    class="font-medium text-sm text-[var(--tool-text)]"
                                  >
                                    Search Steps
                                  </div>
                                  <template
                                    x-for="(step, si) in block.search_steps"
                                    :key="si"
                                  >
                                    <div
                                      class="bg-white/5 border border-[var(--tool-border)]/30 rounded-md p-2.5 text-xs"
                                    >
                                      <div class="flex items-center gap-2 mb-1">
                                        <span
                                          class="badge badge-primary"
                                          x-text="'Step ' + (si + 1)"
                                        ></span>
                                        <span
                                          class="text-[var(--text-primary)]"
                                          x-text="step.query"
                                        ></span>
                                      </div>
                                      <div
                                        class="flex gap-3 text-[var(--text-tertiary)]"
                                      >
                                        <span
                                          x-text="'📄 ' + (step.sources_found || 0) + ' sources'"
                                        ></span>
                                        <span
                                          x-text="'📝 ' + (step.chunks_created || 0) + ' chunks'"
                                        ></span>
                                      </div>
                                      <template x-if="step.reasoning">
                                        <div
                                          class="mt-1.5 pt-1.5 border-t border-[var(--tool-border)]/20"
                                        >
                                          <span
                                            class="text-[var(--thinking-text)] font-medium"
                                            >Analysis:</span
                                          >
                                          <span
                                            class="text-[var(--text-primary)] ml-1"
                                            x-text="step.reasoning"
                                          ></span>
                                        </div>
                                      </template>
                                    </div>
                                  </template>
                                </div>
                              </template>

                              <!-- Result Preview -->
                              <template x-if="block.result">
                                <div>
                                  <div
                                    class="font-medium text-sm text-[var(--success)] mb-2 flex items-center gap-1.5"
                                  >
                                    <i class="ph ph-check-circle"></i> Result
                                  </div>

                                  <!-- Search Web Result -->
                                  <template x-if="block.name === 'search_web'">
                                    <div class="space-y-2">
                                      <template x-if="block.result.content">
                                        <div
                                          class="bg-white/5 border border-[var(--tool-border)]/30 rounded-md p-2.5"
                                        >
                                          <div
                                            class="text-xs text-[var(--text-tertiary)] mb-1"
                                          >
                                            Summary
                                          </div>
                                          <div
                                            class="text-[var(--text-primary)] text-xs whitespace-pre-wrap"
                                            x-text="parseEscapes(block.result.content?.substring(0, 500) + (block.result.content?.length > 500 ? '...' : ''))"
                                          ></div>
                                        </div>
                                      </template>
                                      <template x-if="block.result.sources">
                                        <div
                                          class="text-xs text-[var(--text-tertiary)]"
                                        >
                                          <span
                                            x-text="block.result.sources.length + ' sources found'"
                                          ></span>
                                        </div>
                                      </template>
                                    </div>
                                  </template>

                                  <!-- Query Documents Result -->
                                  <template
                                    x-if="block.name === 'query_documents'"
                                  >
                                    <div class="space-y-2">
                                      <template
                                        x-if="block.result.result_count !== undefined"
                                      >
                                        <div
                                          class="text-xs text-[var(--text-tertiary)]"
                                          x-text="block.result.result_count + ' relevant passages found'"
                                        ></div>
                                      </template>
                                      <template x-if="block.result.context">
                                        <div
                                          class="bg-white/5 border border-[var(--tool-border)]/30 rounded-md p-2.5"
                                        >
                                          <div
                                            class="text-xs text-[var(--text-tertiary)] mb-1"
                                          >
                                            Context Preview
                                          </div>
                                          <div
                                            class="text-[var(--text-primary)] text-xs whitespace-pre-wrap"
                                            x-text="parseEscapes(block.result.context?.substring(0, 300) + (block.result.context?.length > 300 ? '...' : ''))"
                                          ></div>
                                        </div>
                                      </template>
                                    </div>
                                  </template>

                                  <!-- Generic Result -->
                                  <template
                                    x-if="!['search_web', 'query_documents'].includes(block.name)"
                                  >
                                    <div
                                      class="bg-white/5 border border-[var(--tool-border)]/30 rounded-md p-2.5"
                                    >
                                      <div
                                        class="text-[var(--text-primary)] text-xs whitespace-pre-wrap font-mono"
                                        x-text="formatToolResult(block.result)"
                                      ></div>
                                    </div>
                                  </template>
                                </div>
                              </template>

                              <!-- Error -->
                              <template x-if="block.status === 'error'">
                                <div
                                  class="text-[var(--error)] text-xs whitespace-pre-wrap"
                                  x-text="block.result?.error || 'Unknown error'"
                                ></div>
                              </template>
                            </div>
                          </div>
                        </div>
                      </div>
                    </template>

                    <!-- Sources Section -->
                    <template
                      x-if="message.role === 'assistant' && extractSources(message.blocks).length > 0"
                    >
                      <div class="pt-2 border-t border-[var(--border-primary)]">
                        <button
                          @click="toggleBlock('sources-' + message.id)"
                          class="flex items-center gap-1.5 text-xs text-[var(--text-tertiary)] hover:text-[var(--text-primary)] transition-colors"
                        >
                          <i
                            class="ph ph-book-open"
                            :class="isExpanded('sources-' + message.id) ? 'rotate-90' : ''"
                          ></i>
                          <span
                            >Sources (<span
                              x-text="extractSources(message.blocks).length"
                            ></span
                            >)</span
                          >
                        </button>
                        <div
                          x-show="isExpanded('sources-' + message.id)"
                          x-collapse
                        >
                          <div
                            class="mt-2 bg-[var(--bg-tertiary)] border border-[var(--border-primary)] rounded-lg p-3 max-h-48 overflow-y-auto"
                          >
                            <ol
                              class="list-decimal list-inside space-y-1 text-xs"
                            >
                              <template
                                x-for="(source, idx) in extractSources(message.blocks)"
                                :key="idx"
                              >
                                <li class="text-[var(--text-secondary)]">
                                  <a
                                    :href="source.url"
                                    target="_blank"
                                    rel="noopener"
                                    class="text-[var(--text-link)] hover:underline"
                                    x-text="source.title || source.url"
                                  ></a>
                                </li>
                              </template>
                            </ol>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Fallback: plain content (no blocks) -->
                <template
                  x-if="(!message.blocks || message.blocks.length === 0)"
                >
                  <div
                    class="prose"
                    x-html="renderWithCitations(message.content, extractSources(message.blocks))"
                  ></div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Streaming Indicator -->
      <template x-if="isLoading && !toolStatus.active">
        <div class="flex justify-start">
          <div class="message-assistant p-4">
            <div class="flex items-center gap-3">
              <div class="flex items-center gap-1.5">
                <div
                  class="w-2 h-2 bg-[var(--accent-primary)] rounded-full animate-typing-dot"
                ></div>
                <div
                  class="w-2 h-2 bg-[var(--accent-primary)] rounded-full animate-typing-dot"
                ></div>
                <div
                  class="w-2 h-2 bg-[var(--accent-primary)] rounded-full animate-typing-dot"
                ></div>
              </div>
              <button @click="cancelRequest()" class="btn btn-danger btn-xs">
                <i class="ph ph-stop text-xs"></i> Stop
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- Tool Status -->
      <template x-if="toolStatus.active">
        <div class="flex justify-start">
          <div class="tool-block p-3 max-w-md">
            <div class="flex items-center gap-3">
              <i
                class="ph ph-spinner animate-spin text-[var(--tool-text)] text-lg"
              ></i>
              <div class="flex-1 min-w-0">
                <div
                  class="font-medium text-sm text-[var(--tool-text)]"
                  x-text="toolStatus.tool"
                ></div>
                <div
                  class="text-xs text-[var(--text-tertiary)]"
                  x-text="toolStatus.status"
                ></div>
                <template x-if="toolStatus.progress !== null">
                  <div class="progress-bar mt-2">
                    <div
                      class="progress-bar-fill"
                      :style="`width: ${toolStatus.progress}%`"
                    ></div>
                  </div>
                </template>
              </div>
              <button @click="cancelRequest()" class="btn btn-danger btn-xs">
                <i class="ph ph-x text-xs"></i>
              </button>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Input Area -->
    <div
      class="px-4 flex-shrink-0"
    >
      <!-- Input Box -->
      <form @submit.prevent="sendMessage()" class="flex gap-3 items-end">
        <textarea
          x-model="inputMessage"
          @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); sendMessage() }"
          placeholder="Type a message... (Shift+Enter for new line)"
          rows="1"
          class="input flex-1 resize-none min-h-[40px] focus:min-h-[104px] transition-[min-height] duration-150"
          style="max-height: 200px"
          :disabled="isLoading"
          id="chat-input"
        ></textarea>

        <button
          type="submit"
          :disabled="!inputMessage.trim() || isLoading"
          class="btn btn-primary h-[44px] w-[44px] p-0 flex-shrink-0"
          title="Send"
        >
          <i class="ph ph-paper-plane-right text-lg"></i>
        </button>
      </form>

      <!-- Keyboard hint -->
      <div
        class="flex items-center gap-2 mt-2 mb-1 text-xs text-[var(--text-tertiary)]"
      >
        <span><kbd class="kbd">Enter</kbd> Send</span>
        <span><kbd class="kbd">Shift+Enter</kbd> New line</span>
      </div>
    </div>
  </main>
