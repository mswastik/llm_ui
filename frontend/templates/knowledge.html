{% extends "base.html" %}

{% block title %}Knowledge Base — LLM UI{% endblock %}

{% block content %}
<div class="h-screen flex flex-col bg-[var(--bg-primary)]"
     x-data="{ documents: [], loading: true }"
     x-init="documents = await (async () => { try { const r = await fetch('/api/documents'); const d = await r.json(); return d.documents || []; } catch(e) { return []; } })(); loading = false;">

    <!-- Header -->
    <header class="h-[var(--header-height)] border-b border-[var(--border-primary)] px-6 flex items-center justify-between flex-shrink-0 bg-[var(--bg-glass)] backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <a href="/" class="btn btn-icon btn-ghost" title="Back to chat">
                <i class="ph ph-arrow-left text-lg"></i>
            </a>
            <h1 class="text-lg font-semibold flex items-center gap-2">
                <i class="ph ph-books text-[var(--accent-primary)]"></i>
                Knowledge Base
            </h1>
            <span class="text-xs text-[var(--text-tertiary)]" x-text="documents.length + ' documents'"></span>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto p-6">
        <!-- Upload Area -->
        <div class="mb-6">
            <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-xl cursor-pointer border-[var(--border-input)] hover:border-[var(--accent-primary)] hover:bg-[var(--accent-primary-light)]/20 transition-colors">
                <div class="flex flex-col items-center justify-center">
                    <i class="ph ph-upload-simple text-3xl text-[var(--text-tertiary)] mb-2"></i>
                    <p class="text-sm text-[var(--text-secondary)] font-medium">Upload Documents</p>
                    <p class="text-xs text-[var(--text-tertiary)] mt-1">PDF, DOCX, TXT, MD, JSON, YAML • Max 50MB</p>
                </div>
                <input type="file" class="hidden" accept=".pdf,.docx,.txt,.md,.json,.yaml,.yml" @change="(async () => { const formData = new FormData(); formData.append('file', $event.target.files[0]); const res = await fetch('/api/documents/upload', { method: 'POST', body: formData }); if (res.ok) { const data = await res.json(); documents.unshift(data.document); $store.ui.showToast('Document uploaded!', 'success'); } else { const err = await res.json().catch(() => ({})); $store.ui.showToast('Error: ' + (err.detail || 'Upload failed'), 'error'); } })()">
            </label>
        </div>

        <!-- Documents List -->
        <template x-if="loading">
            <div class="flex items-center justify-center h-40">
                <i class="ph ph-spinner animate-spin text-2xl text-[var(--accent-primary)]"></i>
            </div>
        </template>

        <template x-if="!loading && documents.length === 0">
            <div class="empty-state">
                <div class="empty-state-icon">
                    <i class="ph ph-file-x text-3xl text-[var(--accent-primary)]"></i>
                </div>
                <h2 class="text-xl font-semibold mb-1">No Documents</h2>
                <p class="text-sm max-w-md">Upload documents to build your knowledge base. The LLM will be able to search and reference them in conversations.</p>
            </div>
        </template>

        <div class="space-y-2" x-show="!loading && documents.length > 0">
            <template x-for="doc in documents" :key="doc.id">
                <div class="card p-4 flex items-center justify-between group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-lg bg-[var(--accent-primary-light)] flex items-center justify-center flex-shrink-0">
                            <i class="ph ph-file-text text-xl text-[var(--accent-primary)]"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-sm" x-text="doc.filename"></h3>
                            <p class="text-xs text-[var(--text-tertiary)]">
                                <span x-text="doc.file_size ? (doc.file_size < 1024 ? doc.file_size + ' B' : doc.file_size < 1048576 ? (doc.file_size/1024).toFixed(1) + ' KB' : (doc.file_size/1048576).toFixed(1) + ' MB') : '0 B'"></span>
                                <span class="mx-1">•</span>
                                <span x-text="doc.content_type || 'unknown'"></span>
                                <span class="mx-1">•</span>
                                <span x-text="new Date(doc.uploaded_at).toLocaleDateString()"></span>
                            </p>
                        </div>
                    </div>
                    <button @click="if(confirm('Delete this document?')) { fetch('/api/documents/' + doc.id, { method: 'DELETE' }).then(() => { documents = documents.filter(d => d.id !== doc.id); $store.ui.showToast('Document deleted', 'success'); }).catch(() => $store.ui.showToast('Failed to delete', 'error')) }"
                            class="btn btn-icon btn-ghost text-[var(--text-tertiary)] hover:text-[var(--error)] hover:bg-[var(--error-bg)] opacity-0 group-hover:opacity-100 transition-all">
                        <i class="ph ph-trash text-lg"></i>
                    </button>
                </div>
            </template>
        </div>
    </main>
</div>
{% endblock %}
