<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLM UI - Advanced Chat Interface{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">

    <!-- 1. Load utility modules first -->
    <script type="module" src="/static/js/utils.js"></script>
    <script type="module" src="/static/js/services/sse.js"></script>
    <script type="module" src="/static/js/services/tts.js"></script>

    <!-- 2. Load store (registers Alpine.store) -->
    <script type="module" src="/static/js/store.js"></script>

    <!-- 3. Load components (register Alpine.data) -->
    <script type="module" src="/static/js/components/sidebar.js"></script>
    <script type="module" src="/static/js/components/chat.js"></script>
    <script type="module" src="/static/js/components/settings.js"></script>
    <script type="module" src="/static/js/components/documents.js"></script>

    <!-- 4. Load Alpine (after components so they can register) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 h-screen overflow-hidden" {% block body_attrs %}{% endblock %}>
    {% block content %}{% endblock %}

    <!-- Collapse plugin - loads after Alpine, registers automatically -->
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
