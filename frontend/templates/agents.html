{% extends "base.html" %}

{% block content %}
<!-- Agents Management Page -->
<div class="min-h-screen bg-gray-50" x-data="agents" x-init="init()">
    <!-- Header -->
    <div class="bg-white border-b border-gray-200 px-6 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/" class="text-gray-600 hover:text-gray-900">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <h1 class="text-2xl font-bold text-gray-900">AI Agents</h1>
            </div>
            <div class="flex items-center gap-3">
                <a href="/" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    Back to Chat
                </a>
                <button @click="openCreateModal()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">
                    Create Agent
                </button>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        <!-- Agents Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-if="agents.length === 0">
                <div class="col-span-full px-6 py-12 text-center bg-white rounded-lg shadow-sm border border-gray-200">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <p class="mt-2 text-sm text-gray-500">No agents created yet</p>
                </div>
            </template>
            <template x-for="agent in agents" :key="agent.id">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 hover:shadow-md transition">
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-900" x-text="agent.name"></h3>
                            <p class="text-sm text-gray-500 mt-1" x-text="agent.description || 'No description'"></p>
                        </div>
                        <span class="px-2 py-1 text-xs rounded-full" :class="agent.is_active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'" x-text="agent.is_active ? 'Active' : 'Inactive'"></span>
                    </div>
                    
                    <div class="space-y-2 text-sm text-gray-600 mb-4">
                        <div class="flex justify-between">
                            <span>Model:</span>
                            <span class="font-medium" x-text="agent.model"></span>
                        </div>
                        <div class="flex justify-between">
                            <span>Temperature:</span>
                            <span class="font-medium" x-text="agent.temperature"></span>
                        </div>
                        <div class="flex justify-between">
                            <span>Top K:</span>
                            <span class="font-medium" x-text="agent.top_k"></span>
                        </div>
                        <div class="flex justify-between">
                            <span>Web Search:</span>
                            <span class="font-medium" :class="agent.enable_web_search ? 'text-green-600' : 'text-gray-400'" x-text="agent.enable_web_search ? 'Yes' : 'No'"></span>
                        </div>
                        <div class="flex justify-between">
                            <span>RAG:</span>
                            <span class="font-medium" :class="agent.enable_rag ? 'text-green-600' : 'text-gray-400'" x-text="agent.enable_rag ? 'Yes' : 'No'"></span>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-4 border-t border-gray-200">
                        <button @click="editAgent(agent)" class="flex-1 px-3 py-2 text-sm font-medium text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100">Edit</button>
                        <button @click="deleteAgent(agent.id)" class="flex-1 px-3 py-2 text-sm font-medium text-red-600 bg-red-50 rounded-lg hover:bg-red-100">Delete</button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" @click.self="showModal = false">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white">
                <h2 class="text-xl font-bold" x-text="editingAgent ? 'Edit Agent' : 'Create Agent'"></h2>
                <button @click="showModal = false" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Name *</label>
                        <input type="text" x-model="form.name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Model</label>
                        <select x-model="form.model" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <template x-for="model in availableModels" :key="model.id">
                                <option :value="model.id" x-text="model.name || model.id"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                    <textarea x-model="form.description" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">System Prompt</label>
                    <textarea x-model="form.system_prompt" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Temperature</label>
                        <input type="number" step="0.01" min="0" max="2" x-model.number="form.temperature" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Top K</label>
                        <input type="number" x-model.number="form.top_k" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Max Tokens</label>
                        <input type="number" x-model.number="form.max_tokens" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex items-center">
                        <input type="checkbox" x-model="form.enable_web_search" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label class="ml-2 block text-sm text-gray-700">Enable Web Search</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" x-model="form.enable_rag" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label class="ml-2 block text-sm text-gray-700">Enable RAG (Knowledge Base)</label>
                    </div>
                </div>

                <div x-show="form.enable_rag">
                    <label class="block text-sm font-medium text-gray-700 mb-2">RAG Similarity Threshold</label>
                    <input type="number" step="0.05" min="0" max="1" x-model.number="form.rag_similarity_threshold" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3 sticky bottom-0 bg-white">
                <button @click="showModal = false" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</button>
                <button @click="saveAgent()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save Agent</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-transition class="fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50"
        :class="{'bg-green-500 text-white': toast.type === 'success', 'bg-red-500 text-white': toast.type === 'error', 'bg-blue-500 text-white': toast.type === 'info'}"
        x-text="toast.message">
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('agents', () => ({
        agents: [],
        availableModels: [],
        showModal: false,
        editingAgent: null,
        form: {
            name: '', description: '', model: 'qwen3-4b', temperature: 0.7, top_k: 40,
            max_tokens: 16048, system_prompt: '', enable_web_search: false, enable_rag: false,
            rag_similarity_threshold: 0.4, conversation_starters: []
        },
        toast: { show: false, message: '', type: 'success' },

        async init() {
            await Promise.all([this.loadAgents(), this.loadModels()])
        },

        async loadAgents() {
            try {
                const res = await fetch('/api/agents')
                const data = await res.json()
                this.agents = data.agents || []
            } catch (e) {
                this.showToast('Failed to load agents', 'error')
            }
        },

        async loadModels() {
            try {
                const res = await fetch('/api/models')
                const data = await res.json()
                this.availableModels = data.models || []
            } catch (e) {
                console.error('Failed to load models', e)
            }
        },

        openCreateModal() {
            this.editingAgent = null
            this.form = {
                name: '', description: '', model: 'qwen3-4b', temperature: 0.7, top_k: 40,
                max_tokens: 16048, system_prompt: '', enable_web_search: false, enable_rag: false,
                rag_similarity_threshold: 0.4, conversation_starters: []
            }
            this.showModal = true
        },

        editAgent(agent) {
            this.editingAgent = agent
            this.form = { ...agent }
            this.showModal = true
        },

        async saveAgent() {
            if (!this.form.name) {
                this.showToast('Name is required', 'error')
                return
            }
            try {
                const url = this.editingAgent ? `/api/agents/${this.editingAgent.id}` : '/api/agents'
                const method = this.editingAgent ? 'PUT' : 'POST'
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                })
                if (res.ok) {
                    this.showToast(this.editingAgent ? 'Agent updated' : 'Agent created', 'success')
                    this.showModal = false
                    await this.loadAgents()
                } else {
                    const data = await res.json()
                    this.showToast(data.detail || 'Failed to save', 'error')
                }
            } catch (e) {
                this.showToast('Failed to save', 'error')
            }
        },

        async deleteAgent(id) {
            if (!confirm('Delete this agent?')) return
            try {
                const res = await fetch(`/api/agents/${id}`, { method: 'DELETE' })
                if (res.ok) {
                    this.showToast('Agent deleted', 'success')
                    await this.loadAgents()
                } else {
                    this.showToast('Delete failed', 'error')
                }
            } catch (e) {
                this.showToast('Delete failed', 'error')
            }
        },

        showToast(message, type = 'success') {
            this.toast.message = message
            this.toast.type = type
            this.toast.show = true
            setTimeout(() => { this.toast.show = false }, 3000)
        }
    }))
})
</script>
{% endblock %}
