<!-- ═══════════ AI AGENTS MODAL ═══════════ -->
<div
  x-data="modalAgents"
  x-show="open"
  x-cloak
  @open-agents.window="open = true"
  @keydown.escape.window="closeModal()"
  class="modal-backdrop modal-backdrop-agents"
  @click.self="closeModal()"
>
  <div class="modal-content" style="max-width: 800px; width: 100%">
    <!-- Header -->
    <div
      class="px-4 py-2 border-b border-[var(--border-primary)] flex items-center justify-between flex-shrink-0"
    >
      <h2 class="text-lg font-semibold flex items-center gap-2">
        <i class="ph ph-users text-[var(--accent-primary)]"></i>
        AI Agents
      </h2>
      <button @click="closeModal()" class="btn btn-icon btn-ghost">
        <i class="ph ph-x text-lg"></i>
      </button>
    </div>

    <!-- Content -->
    <div
      class="p-6 overflow-y-auto"
      style="max-height: calc(90vh - 140px)"
      x-data="{
            agents: [],
            loading: true,
            showCreate: false,
            editing: null,
            formData: { name: '', description: '', system_prompt: '', model: '', temperature: 0.7, top_k: 3, max_tokens: 4096, enable_rag: false, rag_similarity_threshold: 0.7 },
            availableModels: [],
            async loadAgents() {
                this.loading = true
                try {
                    const r = await fetch('/api/agents')
                    const d = await r.json()
                    this.agents = d.agents || []
                } catch(e) { this.agents = [] }
                this.loading = false
            },
            async loadModels() {
                try {
                    const r = await fetch('/api/models')
                    const d = await r.json()
                    this.availableModels = d.models || []
                } catch(e) { this.availableModels = [] }
            },
            newAgent() {
                this.editing = null
                this.formData = { name: '', description: '', system_prompt: '', model: '', temperature: 0.7, top_k: 3, max_tokens: 4096, enable_rag: false, rag_similarity_threshold: 0.7 }
                this.showCreate = true
            },
            editAgent(agent) {
                this.editing = agent
                this.formData = {
                    name: agent.name || '',
                    description: agent.description || '',
                    system_prompt: agent.system_prompt || '',
                    model: agent.model || '',
                    temperature: agent.temperature ?? 0.7,
                    top_k: agent.top_k ?? 3,
                    max_tokens: agent.max_tokens ?? 4096,
                    enable_rag: !!agent.enable_rag,
                    rag_similarity_threshold: agent.rag_similarity_threshold ?? 0.7
                }
                this.showCreate = true
            },
            async saveAgent() {
                try {
                    const url = this.editing ? '/api/agents/' + this.editing.id : '/api/agents'
                    const method = this.editing ? 'PUT' : 'POST'
                    const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(this.formData) })
                    if (res.ok) {
                        const d = await res.json()
                        if (this.editing) {
                            const idx = this.agents.findIndex(a => a.id === this.editing.id)
                            if (idx !== -1) this.agents[idx] = d.agent
                        } else {
                            this.agents.unshift(d.agent)
                        }
                        this.showCreate = false
                        $store.ui.showToast(this.editing ? 'Agent updated' : 'Agent created', 'success')
                    } else {
                        $store.ui.showToast('Failed to save agent', 'error')
                    }
                } catch(e) { $store.ui.showToast('Failed to save agent', 'error') }
            },
            async deleteAgent(id) {
                if (!confirm('Delete this agent?')) return
                try {
                    await fetch('/api/agents/' + id, { method: 'DELETE' })
                    this.agents = this.agents.filter(a => a.id !== id)
                    $store.ui.showToast('Agent deleted', 'success')
                } catch(e) { $store.ui.showToast('Failed to delete', 'error') }
            },
            async $init() {
                await Promise.all([this.loadAgents(), this.loadModels()])
            }
        }"
      x-init="loadAgents()"
    >
      <!-- Create/Edit Form Modal -->
      <div
        x-show="showCreate"
        x-cloak
        @click.self="showCreate = false"
        class="modal-backdrop modal-backdrop-form"
      >
        <div class="modal-content" style="max-width: 850px; height:100%; width: 100%">
          <div
            class="px-4 py-2 border-b border-[var(--border-primary)] flex items-center justify-between"
          >
            <h2
              class="text-lg font-semibold"
              x-text="editing ? 'Edit Agent' : 'New Agent'"
            ></h2>
            <button @click="showCreate = false" class="btn btn-icon btn-ghost">
              <i class="ph ph-x text-lg"></i>
            </button>
          </div>
          <div
            class="flex flex-col px-4 py-2 space-y-4 overflow-y-auto"
            style="height: 100%"
          >
            <div class="grid grid-cols-2 gap-4">
              <div>
              <label
                class="block text-xs font-medium text-[var(--text-secondary)] mb-1"
                >Name *</label
              >
              <input
                type="text"
                x-model="formData.name"
                class="input text-sm"
                placeholder="My Assistant"
              />
              </div>
              <div>
                <label
                  class="block text-xs font-medium text-[var(--text-secondary)] mb-1"
                  >Model</label
                >
                <select
                  x-model="formData.model"
                  class="input text-sm"
                >
                  <option value="">Select model...</option>
                  <template x-for="m in availableModels" :key="m.id">
                    <option :value="m.id" x-text="m.name || m.id"></option>
                  </template>
                </select>
              </div>
            </div>
            <div>
              <label
                class="block text-xs font-medium text-[var(--text-secondary)] mb-1"
                >Description</label
              >
              <input
                type="text"
                x-model="formData.description"
                class="input text-sm"
                placeholder="What does this agent do?"
              />
            </div>
            <div class="grid grid-cols-4 gap-4">
              <div>
                <label
                  class="block text-xs font-medium text-[var(--text-secondary)] mb-1"
                  >Temperature</label
                >
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  max="2"
                  x-model.number="formData.temperature"
                  class="input text-sm"
                />
              </div>
              <div>
                <label
                  class="block text-xs font-medium text-[var(--text-secondary)] mb-1"
                  >Top K</label
                >
                <input
                  type="number"
                  x-model.number="formData.top_k"
                  class="input text-sm"
                />
              </div>
              <div>
                <label
                  class="block text-xs font-medium text-[var(--text-secondary)] mb-1"
                  >Max Tokens</label
                >
                <input
                  type="number"
                  x-model.number="formData.max_tokens"
                  class="input text-sm"
                />
              </div>
              <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                x-model="formData.enable_rag"
                class="rounded border-[var(--border-input)] text-[var(--accent-primary)]"
              />
              <span class="text-sm text-[var(--text-secondary)]"
                >Enable RAG</span
              >
            </label>
            </div>
            
            <div class="flex flex-col flex-grow">
              <label
                class="block text-xs font-medium text-[var(--text-secondary)] mb-1"
                >System Prompt</label
              >
              <textarea
                x-model="formData.system_prompt"
                rows="4"
                class="flex flex-grow input text-sm resize-none"
                placeholder="You are a helpful assistant..."
              ></textarea>
            </div>
          </div>
          <div
            class="px-4 py-2 border-t border-[var(--border-primary)] flex justify-end gap-2"
          >
            <button @click="showCreate = false" class="btn btn-secondary">
              Cancel
            </button>
            <button @click="saveAgent()" class="btn btn-primary">
              <i class="ph ph-check"></i>
              <span x-text="editing ? 'Update' : 'Create'"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Agent List -->
      <template x-if="loading">
        <div class="flex items-center justify-center py-12">
          <i
            class="ph ph-spinner animate-spin text-3xl text-[var(--accent-primary)]"
          ></i>
        </div>
      </template>

      <template x-if="!loading && agents.length === 0">
        <div class="text-center py-12">
          <i
            class="ph ph-robot text-4xl text-[var(--accent-primary)] mb-3 block opacity-50"
          ></i>
          <h3 class="text-lg font-semibold mb-1">No Agents Yet</h3>
          <p class="text-sm text-[var(--text-tertiary)] mb-4">
            Create an AI agent with a custom personality and configuration.
          </p>
          <button @click="newAgent()" class="btn btn-primary">
            <i class="ph ph-plus"></i> Create First Agent
          </button>
        </div>
      </template>

      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-3"
        x-show="!loading && agents.length > 0"
      >
        <template x-for="agent in agents" :key="agent.id">
          <div class="card p-4 group">
            <div class="flex items-start justify-between mb-2">
              <div class="flex items-center gap-3 min-w-0 flex-1">
                <div
                  class="w-9 h-9 rounded-xl bg-[var(--accent-primary-light)] flex items-center justify-center flex-shrink-0"
                >
                  <i
                    class="ph ph-robot text-lg text-[var(--accent-primary)]"
                  ></i>
                </div>
                <div class="min-w-0">
                  <h3
                    class="font-semibold text-sm truncate"
                    x-text="agent.name"
                  ></h3>
                  <p
                    class="text-xs text-[var(--text-tertiary)]"
                    x-text="agent.model || 'No model'"
                  ></p>
                </div>
              </div>
              <div
                class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0"
              >
                <button
                  @click="editAgent(agent)"
                  class="btn btn-icon btn-ghost text-xs text-[var(--text-tertiary)] hover:text-[var(--accent-primary)]"
                >
                  <i class="ph ph-pencil-simple text-sm"></i>
                </button>
                <button
                  @click="deleteAgent(agent.id)"
                  class="btn btn-icon btn-ghost text-xs text-[var(--text-tertiary)] hover:text-[var(--error)]"
                >
                  <i class="ph ph-trash text-sm"></i>
                </button>
              </div>
            </div>
            <p
              class="text-xs text-[var(--text-secondary)] mb-2 line-clamp-2"
              x-text="agent.description || 'No description'"
            ></p>
            <div class="flex flex-wrap gap-1">
              <template x-if="agent.enable_rag">
                <span class="badge badge-success text-xs"
                  ><i class="ph ph-books text-xs"></i> RAG</span
                >
              </template>
              <template x-if="agent.enabled_tools?.length">
                <span
                  class="badge badge-primary text-xs"
                  x-text="agent.enabled_tools.length + ' tools'"
                ></span>
              </template>
              <span
                class="badge badge-default text-xs"
                x-text="'Temp: ' + agent.temperature"
              ></span>
            </div>
          </div>
        </template>
      </div>

      <!-- Footer -->
      <div
        class="px-6 py-4 border-t border-[var(--border-primary)] flex justify-end flex-shrink-0"
      >
        <button @click="newAgent()" class="btn btn-primary btn-sm">
          <i class="ph ph-plus"></i> New Agent
        </button>
      </div>
    </div>
  </div>
</div>
