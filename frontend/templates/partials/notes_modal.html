<!-- ═══════════ NOTES MODAL ═══════════ -->
<div
  x-data="modalNotes"
  x-show="open"
  x-cloak
  @open-notes.window="open = true"
  @keydown.escape.window="closeModal()"
  class="modal-backdrop modal-backdrop-notes"
  @click.self="closeModal()"
>
  <div class="modal-content" style="max-width: 650px; width: 100%">
    <!-- Header -->
    <div
      class="px-6 py-4 border-b border-[var(--border-primary)] flex items-center justify-between flex-shrink-0"
    >
      <h2 class="text-lg font-semibold flex items-center gap-2">
        <i class="ph ph-notepad text-[var(--accent-primary)]"></i>
        Notes
      </h2>
      <button @click="closeModal()" class="btn btn-icon btn-ghost">
        <i class="ph ph-x text-lg"></i>
      </button>
    </div>

    <!-- Content -->
    <div
      class="p-6 overflow-y-auto"
      style="max-height: calc(90vh - 140px)"
      x-data="{
            notes: [],
            loading: true,
            async loadNotes() {
                this.loading = true
                try {
                    const r = await fetch('/api/notes')
                    const d = await r.json()
                    this.notes = d.notes || []
                    $store.ui.notes = this.notes
                } catch(e) { this.notes = [] }
                this.loading = false
            },
            async deleteNote(id) {
                if (!confirm('Delete this note?')) return
                try {
                    await fetch('/api/notes/' + id, { method: 'DELETE' })
                    this.notes = this.notes.filter(n => n.id !== id)
                    $store.ui.notes = this.notes
                    $store.ui.showToast('Note deleted', 'success')
                } catch(e) { $store.ui.showToast('Failed to delete', 'error') }
            },
            loadConversation(id) {
                closeModal()
                // Trigger conversation load via sidebar event
                window.dispatchEvent(new CustomEvent('load-conversation', { detail: { id } }))
            },
            formatDate(s) {
                if (!s) return ''
                const d = new Date(s)
                const now = new Date()
                const diff = now - d
                if (diff < 60000) return 'Just now'
                if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago'
                if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago'
                return d.toLocaleDateString()
            },
            async $init() {
                await this.loadNotes()
            }
        }"
      x-init="loadNotes()"
    >
      <template x-if="loading">
        <div class="flex items-center justify-center py-12">
          <i class="ph ph-spinner animate-spin text-3xl text-[var(--accent-primary)]"></i>
        </div>
      </template>

      <template x-if="!loading && notes.length === 0">
        <div class="text-center py-12">
          <i class="ph ph-notepad text-4xl text-[var(--accent-primary)] mb-3 block opacity-50"></i>
          <h3 class="text-lg font-semibold mb-1">No Notes Yet</h3>
          <p class="text-sm text-[var(--text-tertiary)] mb-4">
            Take notes from LLM responses to save important information.
          </p>
          <p class="text-xs text-[var(--text-tertiary)]">
            Click the <i class="ph ph-notebook text-xs"></i> icon on any assistant message to create a note.
          </p>
        </div>
      </template>

      <div class="space-y-3" x-show="!loading && notes.length > 0">
        <template x-for="note in notes" :key="note.id">
          <div class="card p-4 group">
            <div class="flex items-start justify-between mb-2">
              <div class="flex items-center gap-2 min-w-0 flex-1">
                <div class="w-7 h-7 rounded-lg bg-[var(--accent-primary-light)] flex items-center justify-center flex-shrink-0">
                  <i class="ph ph-note text-sm text-[var(--accent-primary)]"></i>
                </div>
                <div class="min-w-0">
                  <span class="text-xs text-[var(--text-tertiary)]" x-text="formatDate(note.created_at)"></span>
                  <template x-if="note.conversation_title">
                    <span class="text-xs text-[var(--text-tertiary)] ml-2">
                      from <span class="text-[var(--accent-primary)] cursor-pointer hover:underline" @click="loadConversation(note.conversation_id)" x-text="note.conversation_title"></span>
                    </span>
                  </template>
                </div>
              </div>
              <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                <button
                  @click="loadConversation(note.conversation_id)"
                  class="btn btn-icon btn-ghost text-xs text-[var(--text-tertiary)] hover:text-[var(--accent-primary)]"
                  title="Go to conversation"
                >
                  <i class="ph ph-arrow-square-out text-sm"></i>
                </button>
                <button
                  @click="deleteNote(note.id)"
                  class="btn btn-icon btn-ghost text-xs text-[var(--text-tertiary)] hover:text-[var(--error)]"
                  title="Delete note"
                >
                  <i class="ph ph-trash text-sm"></i>
                </button>
              </div>
            </div>
            <div class="prose text-sm" x-html="note.content ? marked.parse(note.content) : ''"></div>
            <template x-if="note.source_text">
              <div class="mt-2 pt-2 border-t border-[var(--border-primary)]">
                <div class="text-[10px] uppercase tracking-wider text-[var(--text-tertiary)] mb-1 font-semibold">Source</div>
                <div class="text-xs text-[var(--text-secondary)] italic line-clamp-3" x-text="note.source_text.substring(0, 300) + (note.source_text.length > 300 ? '...' : '')"></div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
