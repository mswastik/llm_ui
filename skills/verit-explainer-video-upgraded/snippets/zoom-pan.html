  Slow zoom in + slight pan across a static image — makes screenshots feel alive.
  Track block: 68-70
-->

<!-- HTML → paste before <!-- SCENES_INJECT --> -->
<div class="clip" id="zp-stage" data-start="10.0" data-duration="10.0" data-track-index="68" style="left:240px;top:240px;width:1440px;height:600px;perspective:1500px;overflow:hidden;border-radius:16px;">
  <img id="zp-img" src="screenshots/image.png" style="width:100%;height:100%;object-fit:cover;" alt="Image">
</div>
