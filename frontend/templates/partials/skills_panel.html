<!-- Skills Panel (Settings → Skills tab) -->
<div x-data="skillsPanel" x-init="loadSkills()">
  <!-- View toggle -->
  <div class="flex items-center gap-2 mb-4">
    <button @click="setView('installed')" class="btn btn-sm" :class="view === 'installed' ? 'btn-primary' : 'btn-secondary'">
      <i class="ph ph-tray"></i> Installed
    </button>
    <button @click="setView('registry')" class="btn btn-sm" :class="view === 'registry' ? 'btn-primary' : 'btn-secondary'">
      <i class="ph ph-cloud-arrow-down"></i> Browse Registry
    </button>
  </div>

  <!-- Registry browse view -->
  <div x-show="view === 'registry'" x-cloak class="space-y-3">
    <div class="flex gap-2">
      <input
        type="text"
        x-model="registryQuery"
        @keydown.enter="searchRegistry()"
        class="input text-sm flex-1"
        placeholder="Search skills.sh registry… (blank = most popular)"
      />
      <button @click="searchRegistry()" class="btn btn-primary btn-sm" :disabled="registryLoading">
        <i class="ph ph-magnifying-glass" :class="registryLoading ? 'ph-spinner animate-spin' : ''"></i>
        <span x-text="registryLoading ? 'Searching…' : 'Search'"></span>
      </button>
    </div>
    <p x-show="registryError" class="text-xs text-[var(--text-error)]" x-text="registryError"></p>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
      <template x-for="skill in registryResults" :key="skill.id">
        <div class="card p-3 flex flex-col">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="font-medium text-sm text-[var(--text-primary)] truncate" x-text="skill.name"></div>
              <div class="text-[10px] text-[var(--text-tertiary)] truncate" x-text="skill.source"></div>
            </div>
            <button @click="installFromRegistry(skill)" class="btn btn-primary btn-xs whitespace-nowrap" x-show="!installedNames().has(skill.name)">
              <i class="ph ph-download"></i> Install
            </button>
            <span x-show="installedNames().has(skill.name)" class="badge badge-success text-[10px] whitespace-nowrap">installed</span>
          </div>
          <p class="text-xs text-[var(--text-secondary)] mt-1.5 line-clamp-2 flex-1" x-text="skill.description || 'No description available'"></p>
          <div class="flex items-center gap-3 mt-2 text-[10px] text-[var(--text-tertiary)]">
            <span class="flex items-center gap-0.5"><i class="ph ph-download-simple"></i> <span x-text="skill.installs.toLocaleString()"></span></span>
            <span class="flex items-center gap-0.5" x-show="skill.stars != null"><i class="ph ph-star text-[var(--text-warning)]"></i> <span x-text="Number(skill.stars).toLocaleString()"></span></span>
            <a x-show="skill.repo_url" :href="skill.repo_url" target="_blank" class="flex items-center gap-0.5 ml-auto hover:text-[var(--text-link)]" title="GitHub repository">
              <i class="ph ph-github-logo"></i> GitHub
            </a>
          </div>
        </div>
      </template>
    </div>
      <p x-show="!registryLoading && registryResults.length === 0 && !registryError" class="text-xs text-[var(--text-tertiary)] py-4 text-center">
        Search the registry to find installable skills.
      </p>
    </div>

  <!-- Installed view -->
  <div x-show="view === 'installed'" x-cloak>
    <div class="flex items-center justify-between mb-4">
        <p class="text-xs text-[var(--text-tertiary)]">
          Skills live in <code class="text-[var(--text-code)]">skills/&lt;name&gt;/SKILL.md</code>.
          The agent loads them on demand via <code class="text-[var(--text-code)]">load_skill</code>.
        </p>
        <button @click="startCreate()" class="btn btn-primary btn-sm">
          <i class="ph ph-plus"></i> New Skill
        </button>
      </div>

      <!-- Create/Edit form -->
      <div x-show="showForm" x-collapse class="mb-5 p-4 rounded-lg bg-[var(--bg-tertiary)] border border-[var(--border-primary)] space-y-3">
        <div>
          <label class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Name (slug)</label>
          <input type="text" x-model="form.name" class="input text-sm" placeholder="e.g. news-fetch" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Description (one line, shown in the agent's skill index)</label>
          <input type="text" x-model="form.description" class="input text-sm" placeholder="Fetch and summarize the latest news on a topic" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Instructions (markdown body of SKILL.md)</label>
          <textarea x-model="form.instructions" rows="8" class="input text-sm w-full font-mono" placeholder="Step-by-step instructions the agent follows when this skill is loaded..."></textarea>
        </div>
        <div class="flex gap-2">
          <button @click="saveSkill()" class="btn btn-primary btn-sm" :disabled="!form.name || !form.instructions">
            <i class="ph ph-check"></i> Save
          </button>
          <button @click="cancelForm()" class="btn btn-secondary btn-sm">Cancel</button>
        </div>
      </div>

      <!-- Skill list -->
      <div class="space-y-2">
        <template x-for="skill in skills" :key="skill.path">
          <div class="p-3 rounded-lg bg-[var(--bg-tertiary)] border border-[var(--border-primary)]">
            <div class="flex items-center gap-2">
              <i class="ph ph-wrench text-[var(--accent-primary)]"></i>
              <span class="font-medium text-sm text-[var(--text-primary)]" x-text="skill.name"></span>
              <span x-show="skill.draft" class="badge badge-warning text-[10px]">draft</span>
              <span class="text-xs text-[var(--text-secondary)] truncate ml-2" x-text="skill.description"></span>
              <div class="ml-auto flex items-center gap-1.5">
                <button @click="viewSkill(skill)" class="btn btn-icon btn-ghost p-1.5" title="View">
                  <i class="ph ph-eye text-sm"></i>
                </button>
                <button x-show="!skill.draft" @click="startEdit(skill)" class="btn btn-icon btn-ghost p-1.5" title="Edit">
                  <i class="ph ph-pencil-simple text-sm"></i>
                </button>
                <button x-show="skill.draft" @click="acceptDraft(skill.name)" class="btn btn-primary btn-xs" title="Approve draft">
                  <i class="ph ph-check"></i> Accept
                </button>
                <button x-show="skill.draft" @click="rejectDraft(skill.name)" class="btn btn-secondary btn-xs" title="Reject draft">
                  <i class="ph ph-x"></i> Reject
                </button>
                <button @click="deleteSkill(skill.name, skill.draft)" class="btn btn-icon btn-ghost p-1.5 text-red-500" title="Delete">
                  <i class="ph ph-trash text-sm"></i>
                </button>
              </div>
            </div>
            <div x-show="viewingName === skill.name && !skill.draft" class="mt-3">
              <pre class="bg-[var(--bg-code)] rounded-md p-3 text-xs text-[var(--text-code)] overflow-x-auto whitespace-pre-wrap max-h-72 overflow-y-auto" x-text="viewContent"></pre>
            </div>
          </div>
        </template>
        <p x-show="skills.length === 0" class="text-xs text-[var(--text-tertiary)] py-4 text-center">No skills yet. Create one, or drop a folder into <code class="text-[var(--text-code)]">skills/</code>.</p>
      </div>
    </div>
  </div>
