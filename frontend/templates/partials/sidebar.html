<!-- Sidebar Component -->

<div :class="sidebarCollapsed ? 'w-16' : 'w-70'"
     class="bg-white border-r border-gray-200 flex flex-col transition-all duration-300 overflow-hidden"
     x-data="sidebar" 
     x-init="init()">

    <!-- Sidebar Header -->
    <div class="p-2 border-b border-gray-200 flex items-center justify-between gap-1">
        <template x-if="!sidebarCollapsed">
            <button
                @click="createNewConversation()"
                class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                New Chat
            </button>
        </template>
        <button
            @click="toggleSidebar()"
            class="p-2 rounded-lg hover:bg-gray-100 transition text-gray-600"
            :title="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
            <svg class="w-5 h-5 transition-transform duration-300" :class="sidebarCollapsed ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
            </svg>
        </button>
    </div>

    <!-- Conversations List (Expanded) -->
    <div class="flex-1 overflow-y-auto p-1 space-y-1" x-show="!sidebarCollapsed">
        <template x-for="conv in conversations" :key="conv.id">
            <div
                @click="loadConversation(conv.id)"
                :class="currentConversationId === conv.id ? 'bg-blue-100' : 'bg-white hover:bg-gray-50'"
                class="rounded-lg max-w-xs cursor-pointer transition group">
                <div class="flex justify-between">
                    <div class="pl-1">
                        <div class="p-0.5 font-medium text-sm text-gray-900 truncate" x-text="conv.title"></div>
                        <div class="text-xs text-gray-500" x-text="formatDate(conv.updated_at)"></div>
                    </div>
                    <button
                        @click="deleteConversation(conv.id, $event)"
                        class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition p-1"
                        title="Delete conversation">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- Quick Access Icons (Collapsed) -->
    <div class="flex-1 overflow-y-auto p-2 space-y-2" x-show="sidebarCollapsed">
        <template x-for="conv in conversations.slice(0, 5)" :key="conv.id">
            <div
                @click="loadConversation(conv.id); sidebarCollapsed = false"
                :class="currentConversationId === conv.id ? 'bg-blue-100' : 'hover:bg-gray-100'"
                class="p-2 rounded-lg cursor-pointer transition flex items-center justify-center"
                :title="conv.title">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
            </div>
        </template>
    </div>

    <!-- Bottom Actions (Expanded) -->
    <div class="border-t border-gray-200" x-show="!sidebarCollapsed">
        <button
            @click="$store.documents.show = true"
            class="w-full text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Knowledge Base
        </button>
        <button
            @click="$store.settings.show = true"
            class="w-full text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Settings
        </button>
    </div>

    <!-- Bottom Actions (Collapsed) -->
    <div class="border-t border-gray-200" x-show="sidebarCollapsed">
        <button
            @click="$store.documents.show = true"
            class="w-full p-2 text-gray-600 hover:bg-gray-100 transition flex items-center justify-center"
            title="Knowledge Base">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
        </button>
        <button
            @click="$store.settings.show = true"
            class="w-full p-2 text-gray-600 hover:bg-gray-100 transition flex items-center justify-center"
            title="Settings">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </button>
    </div>
</div>
