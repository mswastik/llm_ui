<!-- MCP Servers & Tools Panel -->
<div x-show="showMcpPanel"
     x-transition
     class="w-80 bg-white border-l border-gray-200 flex flex-col overflow-hidden"
     x-data="mcpPanel">

    <!-- Panel Header -->
    <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between flex-shrink-0">
        <h3 class="font-semibold text-gray-900">MCP Servers & Tools</h3>
        <button @click="showMcpPanel = false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <!-- MCP Servers Section -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Servers List -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <h4 class="text-sm font-medium text-gray-700">MCP Servers</h4>
                <a href="/settings" class="text-xs text-blue-600 hover:text-blue-800">Manage</a>
            </div>

            <template x-if="mcpServers.length === 0">
                <div class="text-sm text-gray-500 text-center py-4 bg-gray-50 rounded-lg">
                    No MCP servers configured
                </div>
            </template>

            <template x-for="server in mcpServers" :key="server.name">
                <div class="border border-gray-200 rounded-lg p-3 mb-2">
                    <div class="flex items-start justify-between mb-2">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <div class="font-medium text-sm text-gray-900 truncate" x-text="server.name"></div>
                                <span class="text-xs px-1.5 rounded-full"
                                      :class="server.is_connected ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                                      x-text="server.is_connected ? 'Connected' : 'Disconnected'">
                                </span>
                            </div>
                            <div class="text-xs text-gray-500" x-text="server.transport_type"></div>
                            <div class="text-xs text-gray-500" x-show="server.tool_count > 0" x-text="server.tool_count + ' tool' + (server.tool_count === 1 ? '' : 's')"></div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox"
                                   :checked="server.enabled !== false"
                                   @change="toggleServer(server.name, $event.target.checked)"
                                   class="sr-only peer">
                            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>

                    <!-- Server Tools - Collapsible -->
                    <template x-if="server.tools && server.tools.length > 0">
                        <div>
                            <button @click="server.toolsExpanded = !server.toolsExpanded"
                                    class="flex items-center gap-1 text-xs text-gray-600 hover:text-gray-800 transition mb-1">
                                <svg class="w-3 h-3 transition-transform duration-200" :class="server.toolsExpanded ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                                <span x-text="server.tools.length + ' tool' + (server.tools.length === 1 ? '' : 's')"></span>
                            </button>
                            <div x-show="server.toolsExpanded" x-collapse class="flex flex-wrap gap-1">
                                <template x-for="tool in server.tools" :key="tool.name">
                                    <span class="inline-flex items-center gap-1 text-xs px-2 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-200"
                                          :title="tool.description || tool.name"
                                          x-text="tool.name">
                                    </span>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template x-if="server.is_connected && (!server.tools || server.tools.length === 0)">
                        <div class="text-xs text-gray-400 italic">No tools available</div>
                    </template>
                    <template x-if="!server.is_connected">
                        <div class="text-xs text-orange-600 italic">Server not connected - tools unavailable</div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Custom Tools Section - Collapsible -->
        <div class="pt-4 border-t border-gray-200" x-show="mcpServers.length > 0 || customTools.length > 0">
            <h4 class="text-sm font-medium text-gray-700 mb-2">Built-in Tools</h4>

            <template x-if="customTools.length === 0">
                <div class="text-sm text-gray-500 text-center py-4 bg-gray-50 rounded-lg">
                    No built-in tools available
                </div>
            </template>

            <template x-if="customTools.length > 0">
                <div>
                    <button @click="customToolsExpanded = !customToolsExpanded"
                            class="flex items-center gap-1 text-xs text-gray-600 hover:text-gray-800 transition mb-1">
                        <svg class="w-3 h-3 transition-transform duration-200" :class="customToolsExpanded ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                        <span x-text="customTools.length + ' tool' + (customTools.length === 1 ? '' : 's')"></span>
                    </button>
                    <div x-show="customToolsExpanded" x-collapse class="space-y-1">
                        <template x-for="tool in customTools" :key="tool.name">
                            <div class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0">
                                <div>
                                    <div class="text-sm font-medium text-gray-900" x-text="tool.name"></div>
                                    <div class="text-xs text-gray-500" x-text="tool.description || ''"></div>
                                </div>
                                <span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-700">Available</span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Info Footer -->
    <div class="px-4 py-3 border-t border-gray-200 bg-gray-50 flex-shrink-0">
        <div class="text-xs text-gray-500">
            <p>Enable/disable MCP servers. Tools are automatically available when servers are connected.</p>
        </div>
    </div>
</div>

<script>
// MCP Panel Component
window.mcpPanel = () => {
  return {
    showMcpPanel: false,
    mcpServers: [],
    customTools: [],
    initialized: false,

    async init() {
      await this.loadMCPData()
      this.initialized = true

      // Expose toggle method globally for sidebar button
      window.toggleMcpPanel = () => {
        this.showMcpPanel = !this.showMcpPanel
        if (this.showMcpPanel) {
          this.loadMCPData()
        }
      }
    },

    async loadMCPData() {
      try {
        const [serversRes, toolsRes] = await Promise.all([
          fetch('/api/mcp/servers'),
          fetch('/api/mcp/tools')
        ])

        const serversData = await serversRes.json()
        const toolsData = await toolsRes.json()

        // Process servers - add tools to each server
        const allTools = toolsData.tools || []
        const servers = serversData.servers || []

        // Group tools by server and add expanded state
        this.mcpServers = servers.map(server => {
          const serverTools = allTools.filter(tool => tool.server === server.name)
          return {
            ...server,
            tools: serverTools,
            enabled: server.enabled !== false,
            toolsExpanded: false  // Collapsed by default
          }
        })

        this.customTools = toolsData.custom_tools || []
        this.customToolsExpanded = false  // Collapsed by default

        console.log('[MCP Panel] Loaded servers:', this.mcpServers.length, 'custom tools:', this.customTools.length)
      } catch (error) {
        console.error('Error loading MCP data:', error)
        // Initialize with empty arrays to prevent template errors
        this.mcpServers = []
        this.customTools = []
        this.customToolsExpanded = false
      }
    },

    async toggleServer(serverName, enabled) {
      try {
        const res = await fetch(`/api/mcp/servers/${serverName}/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled })
        })

        if (res.ok) {
          // Update local state
          const server = this.mcpServers.find(s => s.name === serverName)
          if (server) {
            server.enabled = enabled
          }
        }
      } catch (error) {
        console.error('Error toggling server:', error)
      }
    }
  }
}
</script>
